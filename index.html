<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainlyHQ - Home</title>
    <link rel="icon" type="image/png" href="assets/BRAINLYHQ LOGO.png">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
    <script src="js/main.js" defer></script>
</head>
<body>

    <header id="header-placeholder"></header>

    <main>
        <section style="max-width: 800px; margin: 80px auto; text-align: center; padding: 20px;">
            <h1 data-translate="hero-title" style="font-size: 3.2rem; font-weight: 900; margin-bottom: 20px; color: var(--color-brainly-dark-blue); line-height: 1.1;">
                Official BrainlyHQ Hub
            </h1>
            <p data-translate="hero-subtitle" style="font-size: 1.25rem; color: var(--text-secondary); margin-bottom: 35px; max-width: 600px; margin-left: auto; margin-right: auto;">
                Where passion for learning meets technology and community. Discover our moderating tools and grow with us!
            </p>
            <a href="contact.html" data-translate="hero-cta" class="cta-btn" style="display: inline-block; background-color: var(--color-brainly-green); color: #000; padding: 14px 36px; border-radius: 30px; text-decoration: none; font-weight: 700; box-shadow: 0 4px 15px rgba(153, 238, 96, 0.4); transition: transform 0.2s ease;">
                Join Us
            </a>
        </section>
    </main>

    <footer id="footer-placeholder"></footer>

</body>
</html>
