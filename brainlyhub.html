<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainlyHub - Search Engine & Database</title>

    <link rel="icon" type="image/png" href="assets/Brainly Hub.png">
    <link rel="stylesheet" href="css/style.css">

    <style>
        :root {
            --bg-app: #f8fafc;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #ffffff;
            --bg-hover: #f1f5f9;
            --bg-active: #e2e8f0;

            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-subtle: #94a3b8;

            --border-subtle: #e2e8f0;
            --border-strong: #cbd5e1;
            
            --accent-green: #3da80a;
            --accent-green-subtle: #f0fdf4;
            --accent-green-border: #bbf7d0;

            --sidebar-width: 240px;

            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 12px 32px -4px rgba(15, 23, 42, 0.12);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-pill: 9999px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .app-layout {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 100;
            flex-shrink: 0;
            user-select: none;
        }

        .sidebar-header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .sidebar-nav {
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
            white-space: nowrap;
            overflow: hidden;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        .nav-item.active {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .badge-pill {
            margin-left: auto;
            background: var(--bg-active);
            color: var(--text-main);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-stats-card {
            background: var(--bg-hover);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-row strong {
            color: var(--text-main);
            font-weight: 700;
        }

        /* --- MAIN WRAPPER --- */
        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .content-scroll-area {
            flex-grow: 1;
            overflow-y: auto;
            padding: 24px 24px 140px 24px;
            scroll-behavior: smooth;
        }

        .content-max-width {
            max-width: 960px;
            margin: 0 auto;
            width: 100%;
        }

        .featured-section {
            margin-top: 10px;
        }

        .section-header-title {
            font-size: 0.8125rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .package-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
            position: relative;
            box-shadow: var(--shadow-sm);
        }

        .package-card:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .package-card-featured {
            border-color: var(--border-subtle);
            background: var(--bg-card);
        }

        .package-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .badge {
            font-size: 0.6875rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: var(--radius-sm);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .badge-market { background: var(--bg-hover); color: var(--text-main); border: 1px solid var(--border-subtle); }
        .badge-level { background: #f1f5f9; color: #475569; }
        .badge-subject { background: #eff6ff; color: #2563eb; }
        .badge-exam { background: #fffbeb; color: #d97706; }

        .package-topic {
            font-size: 0.975rem;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.4;
            color: var(--text-main);
        }

        .package-card .contains-count,
        .package-card .contains-tasks,
        .package-card .task-count,
        .package-tasks-count,
        .contains-info,
        .contains-text {
            color: var(--text-main) !important;
            font-weight: 700;
        }

        .btn-open-package {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 9px 12px;
            background-color: var(--text-main);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.8125rem;
            border-radius: var(--radius-sm);
            transition: background-color 0.15s ease;
            box-sizing: border-box;
            cursor: pointer;
            border: none;
        }

        .btn-open-package:hover {
            background-color: #1e293b;
        }

        .results-section {
            margin-top: 10px;
            display: none;
            animation: fadeIn 0.2s ease-out forwards;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .results-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
        }

        .results-count {
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- BOTTOM SEARCH PROMPT BAR --- */
        .bottom-search-wrapper {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, rgba(248, 250, 252, 0) 0%, rgba(248, 250, 252, 0.95) 35%, #f8fafc 100%);
            padding: 16px 24px 24px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 50;
            pointer-events: none;
        }

        .bottom-search-container {
            max-width: 800px;
            width: 100%;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .filters-inline-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .filters-inline-bar::-webkit-scrollbar {
            display: none;
        }

        .filter-select {
            background-color: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 6px 28px 6px 12px;
            border-radius: var(--radius-pill);
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.15s ease, color 0.15s ease;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 10px center;
            box-shadow: var(--shadow-sm);
            white-space: nowrap;
        }

        .filter-select:hover, .filter-select:focus {
            border-color: var(--border-strong);
            color: var(--text-main);
        }

        .ai-search-box {
            position: relative;
            background-color: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 6px 12px;
            box-shadow: var(--shadow-lg);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
        }

        .ai-search-box:focus-within {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-lg), 0 0 0 2px rgba(15, 23, 42, 0.05);
        }

        .search-icon-svg {
            width: 20px;
            height: 20px;
            color: var(--text-subtle);
            margin-left: 8px;
            flex-shrink: 0;
        }

        .ai-search-input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 12px 12px;
            font-size: 0.95rem;
            color: var(--text-main);
            font-family: inherit;
            outline: none;
        }

        .ai-search-input::placeholder {
            color: var(--text-subtle);
        }

        .clear-search-btn {
            background: var(--bg-hover);
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0;
            flex-shrink: 0;
            margin-right: 4px;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .clear-search-btn:hover {
            background: #ef4444;
            color: #ffffff;
        }

        /* --- FAVORITES SIDE DRAWER --- */
        .fav-drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.25);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            z-index: 1000;
            display: none;
            justify-content: flex-end;
        }

        .fav-drawer-card {
            background: var(--bg-sidebar);
            border-left: 1px solid var(--border-subtle);
            width: 380px;
            max-width: 85vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            animation: slideInRight 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        .fav-modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-sidebar);
        }

        .fav-modal-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
        }

        .btn-close-modal {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.25rem;
            cursor: pointer;
            line-height: 1;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border-radius: var(--radius-sm);
            transition: background 0.15s ease, color 0.15s ease;
            flex-shrink: 0;
        }

        .btn-close-modal:hover {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        .fav-modal-body {
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .fav-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            gap: 12px;
            box-shadow: var(--shadow-sm);
        }

        .fav-item-topic {
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-main);
            line-height: 1.3;
        }

        .fav-item-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .fav-item-actions .btn-open-package {
            height: 32px;
            padding: 0 14px;
            font-size: 0.78rem;
            width: auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .btn-fav-remove {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #ef4444;
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .btn-fav-remove:hover {
            background: #ef4444;
            color: #ffffff;
        }

        /* --- INLINE PACKAGE VIEW (Replaces Modal) --- */
        .inline-package-view {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-sm);
            margin-top: 10px;
        }

        .package-header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }

        .package-header-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-main);
            margin: 12px 0 6px 0;
            line-height: 1.3;
        }

        .package-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-action-icon {
            background: var(--bg-hover);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            width: 38px;
            height: 38px;
            border-radius: var(--radius-md);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 0;
            flex-shrink: 0;
        }

        .btn-action-icon:hover {
            border-color: var(--border-strong);
            color: var(--text-main);
        }

        .btn-action-icon.active-fav {
            color: #ef4444;
            border-color: #fecaca;
            background: #fef2f2;
        }

        /* PROGRESS BAR */
        .learning-progress-box {
            background: var(--bg-app);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 14px 16px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8125rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--bg-hover);
            border-radius: var(--radius-pill);
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-green);
            transition: width 0.3s ease;
        }

        .tasks-list-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-item-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.15s ease, background 0.15s ease;
            gap: 16px;
        }

        .task-item-card:hover {
            border-color: var(--border-strong);
        }

        .task-item-card.completed-task {
            opacity: 0.65;
            background: var(--bg-app);
        }

        .task-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .custom-chk-container {
            display: inline-flex;
            align-items: center;
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .custom-chk-container input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .checkmark-circle {
            height: 20px;
            width: 20px;
            background-color: var(--bg-app);
            border: 1.5px solid var(--border-subtle);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }

        .custom-chk-container:hover input ~ .checkmark-circle {
            border-color: var(--border-strong);
        }

        .custom-chk-container input:checked ~ .checkmark-circle {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
        }

        .checkmark-icon {
            display: none;
            width: 12px;
            height: 12px;
            color: #ffffff;
        }

        .custom-chk-container input:checked ~ .checkmark-circle .checkmark-icon {
            display: block;
        }

        .task-item-title {
            font-size: 0.925rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .task-item-card.completed-task .task-item-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .btn-task-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--text-main);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.78rem;
            padding: 7px 14px;
            border-radius: var(--radius-sm);
            transition: background 0.15s ease;
            flex-shrink: 0;
        }

        .btn-task-link:hover {
            background-color: #1e293b;
        }

        .toast-notification {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--text-main);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: var(--radius-md);
            font-size: 0.8125rem;
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.25s ease;
            z-index: 3000;
        }

        .toast-notification.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>

    <script src="js/theme.js"></script>
    <script src="js/hub-render.js"></script>
    <script src="js/hub-engine.js"></script>
</head>
<body>

    <div class="app-layout">
        
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div>
                <nav class="sidebar-nav" style="margin-top: 12px;">
                    <!-- New Search -->
                    <button class="nav-item active" onclick="resetSearchUI()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        <span class="nav-label">New Search</span>
                    </button>

                    <!-- Favorites -->
                    <button id="btn-open-favs" class="nav-item" onclick="openFavModal()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        <span class="nav-label">Favorites</span>
                        <span id="fav-count-badge" class="badge-pill">0</span>
                    </button>
                </nav>
            </div>

            <div class="sidebar-footer">
                <div class="sidebar-stats-card">
                    <div class="stats-row"><span>Package Database:</span> <strong id="stat-packages-count">0</strong></div>
                    <div class="stats-row"><span>Task Links:</span> <strong id="stat-links-count">0</strong></div>
                    <div class="stats-row"><span>Markets:</span> <strong id="stat-markets-count">11</strong></div>
                    <div class="stats-row"><span>Subjects:</span> <strong id="stat-subjects-count">30</strong></div>
                    <div class="stats-row"><span>Levels:</span> <strong id="stat-levels-count">5</strong></div>
                </div>
            </div>
        </aside>

        <!-- MAIN WRAPPER -->
        <div class="main-wrapper">

            <!-- OBSZAR GŁÓWNEJ TREŚCI -->
            <main class="content-scroll-area">
                <div class="content-max-width">
                    
                    <!-- Domyślne popularne paczki -->
                    <div id="initial-placeholder" class="featured-section">
                        <div class="section-header-title">
                            Popular &amp; Latest Additions
                        </div>
                        <div id="featured-packages-grid" class="packages-grid"></div>
                    </div>

                    <!-- Wyniki wyszukiwania -->
                    <section id="results-section" class="results-section">
                        <div class="results-header">
                            <h3 class="results-title">Question Database</h3>
                            <span id="results-count-text" class="results-count">0 packages found</span>
                        </div>
                        <div id="packages-container" class="packages-grid"></div>
                    </section>

                    <!-- WIDOK PACZKI IN-LINE (Zastępuje dawny modal) -->
                    <section id="inline-package-view" class="inline-package-view" style="display: none; animation: fadeIn 0.2s ease-out forwards;">
                        <div id="package-inline-header-content"></div>

                        <div class="learning-progress-box" style="margin-top: 20px; margin-bottom: 20px;">
                            <div class="progress-info">
                                <span>Progress</span>
                                <span id="progress-count-text">0 / 0 completed (0%)</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div id="progress-bar-fill" class="progress-bar-fill"></div>
                            </div>
                        </div>

                        <div id="tasks-list-target" class="tasks-list-section"></div>
                    </section>

                </div>
            </main>

            <!-- PROMPT BAR NA DOLE -->
            <div class="bottom-search-wrapper">
                <div class="bottom-search-container">
                    
                    <!-- FILTRY -->
                    <div class="filters-inline-bar">
                        <select id="filter-market" class="filter-select">
                            <option value="">All Markets</option>
                        </select>
                        <select id="filter-level" class="filter-select">
                            <option value="">All Levels</option>
                        </select>
                        <select id="filter-subject" class="filter-select">
                            <option value="">All Subjects</option>
                        </select>
                    </div>

                    <!-- WYSZUKIWARKA -->
                    <div class="ai-search-box">
                        <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="ai-search-input" class="ai-search-input" placeholder="Type a topic, phrase or keyword..." autocomplete="off">
                        <button id="clear-search-btn" class="clear-search-btn" title="Clear search">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- ULUBIONE (DRAWER) -->
    <div id="fav-modal" class="fav-drawer-overlay" onclick="if(event.target === this) closeFavModal();">
        <div class="fav-drawer-card">
            <div class="fav-modal-header">
                <h3 class="fav-modal-title">Saved Packages</h3>
                <button class="btn-close-modal" onclick="closeFavModal()">&times;</button>
            </div>
            <div id="fav-modal-list" class="fav-modal-body">
                <p style="color: var(--text-muted); text-align: center; font-size: 0.875rem;">No favorite packages saved yet.</p>
            </div>
        </div>
    </div>

    <div id="toast" class="toast-notification">Notification</div>

    <!-- SCRIPT LOGIC -->
    <script>
        let currentPackageObj = null;

        function toggleSidebar() {
            // Funkcja celowo pusta - sidebar na stałe rozwinięty
        }

        function focusSearchInput() {
            const input = document.getElementById('ai-search-input');
            if (input) input.focus();
        }

        function resetSearchUI() {
            // Ukrywamy widok paczki i przywracamy wyszukiwarkę
            document.getElementById('inline-package-view').style.display = 'none';
            document.querySelector('.bottom-search-wrapper').style.display = 'flex';

            const input = document.getElementById('ai-search-input');
            if (input) input.value = '';
            
            const fMarket = document.getElementById('filter-market');
            if (fMarket) fMarket.value = '';
            
            const fLevel = document.getElementById('filter-level');
            if (fLevel) fLevel.value = '';
            
            const fSubject = document.getElementById('filter-subject');
            if (fSubject) fSubject.value = '';
            
            // Renderujemy domyślny widok za pomocą silnika jeśli istnieje, 
            // a jeśli nie, manualnie pokazujemy powrót do ekranu startowego
            if (typeof filterData === 'function') {
                filterData(); 
            } else {
                document.getElementById('initial-placeholder').style.display = 'block';
                document.getElementById('results-section').style.display = 'none';
            }
            
            focusSearchInput();
        }

        // Naprawiona i zabezpieczona funkcja
        function escapeHtml(str) {
            if (!str) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function getFavs() {
            try { return JSON.parse(localStorage.getItem("brainly_favorites")) || []; } catch(e) { return []; }
        }

        function updateFavBadge() {
            const favs = getFavs();
            const badge = document.getElementById("fav-count-badge");
            if (badge) badge.textContent = favs.length;
        }

        function openFavModal() {
            const modal = document.getElementById("fav-modal");
            const listTarget = document.getElementById("fav-modal-list");
            const favs = getFavs();

            if (favs.length === 0) {
                listTarget.innerHTML = `<p style="color: var(--text-muted); text-align: center; font-size: 0.875rem;">No favorite packages saved yet.</p>`;
            } else {
                listTarget.innerHTML = "";
                favs.forEach(f => {
                    const row = document.createElement("div");
                    row.className = "fav-item-row";
                    
                    row.innerHTML = `
                        <span class="fav-item-topic">${escapeHtml(f.topic)} (${escapeHtml(f.market)})</span>
                        <div class="fav-item-actions">
                            <button class="btn-open-package" onclick="openPackageDetails('${escapeHtml(f.topic)}', '${escapeHtml(f.market)}')">Open</button>
                            <button class="btn-fav-remove" title="Remove from favorites" onclick="removeFavFromModal('${escapeHtml(f.topic)}', '${escapeHtml(f.market)}')">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                            </button>
                        </div>
                    `;
                    listTarget.appendChild(row);
                });
            }
            modal.style.display = "flex";
        }

        function closeFavModal() {
            document.getElementById("fav-modal").style.display = "none";
        }

        function removeFavFromModal(topic, market) {
            let favs = getFavs();
            favs = favs.filter(f => !(f.topic.toLowerCase() === topic.toLowerCase() && f.market.toUpperCase() === market.toUpperCase()));
            localStorage.setItem("brainly_favorites", JSON.stringify(favs));
            updateFavBadge();
            openFavModal();
        }

        /* --- PACKAGE DETAILS LOGIC --- */
        function isFavorite(topic, market) {
            const favs = getFavs();
            return favs.some(f => f.topic.toLowerCase() === topic.toLowerCase() && f.market.toUpperCase() === market.toUpperCase());
        }

        function toggleFavorite(topic, market) {
            let favs = getFavs();
            if (isFavorite(topic, market)) {
                favs = favs.filter(f => !(f.topic.toLowerCase() === topic.toLowerCase() && f.market.toUpperCase() === market.toUpperCase()));
                showToast("Removed from favorites");
            } else {
                favs.push({ topic, market, addedAt: Date.now() });
                showToast("Added to favorites");
            }
            localStorage.setItem("brainly_favorites", JSON.stringify(favs));
            updateFavBadge();
            updateFavButtonUI(topic, market);
        }

        function updateFavButtonUI(topic, market) {
            const btn = document.getElementById("btn-fav-toggle");
            if (!btn) return;
            const active = isFavorite(topic, market);
            btn.classList.toggle("active-fav", active);
            btn.innerHTML = active 
                ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`
                : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
        }

        function getProgress() {
            try { return JSON.parse(localStorage.getItem("brainly_learning_progress")) || {}; } catch(e) { return {}; }
        }

        function toggleTaskCompletion(packageKey, taskUrl) {
            const prog = getProgress();
            if (!prog[packageKey]) prog[packageKey] = [];
            const idx = prog[packageKey].indexOf(taskUrl);
            if (idx > -1) {
                prog[packageKey].splice(idx, 1);
            } else {
                prog[packageKey].push(taskUrl);
            }
            localStorage.setItem("brainly_learning_progress", JSON.stringify(prog));
            renderProgressUI(packageKey);
        }

        function renderProgressUI(packageKey) {
            if (!currentPackageObj) return;
            const prog = getProgress();
            const completedUrls = prog[packageKey] || [];
            const totalTasks = currentPackageObj.structuredLinks.length;
            const completedCount = currentPackageObj.structuredLinks.filter(l => completedUrls.includes(l.url)).length;
            const percentage = totalTasks > 0 ? Math.round((completedCount / totalTasks) * 100) : 0;

            const countEl = document.getElementById("progress-count-text");
            const fillEl = document.getElementById("progress-bar-fill");
            if (countEl) countEl.textContent = `${completedCount} / ${totalTasks} completed (${percentage}%)`;
            if (fillEl) fillEl.style.width = `${percentage}%`;

            currentPackageObj.structuredLinks.forEach((linkObj, idx) => {
                const card = document.getElementById(`task-card-${idx}`);
                const chk = document.getElementById(`task-chk-${idx}`);
                const isDone = completedUrls.includes(linkObj.url);
                if (card) card.classList.toggle("completed-task", isDone);
                if (chk) chk.checked = isDone;
            });
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.textContent = msg;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 2500);
        }

        function openPackageDetails(topic, market) {
            closeFavModal();
            const cachedData = localStorage.getItem("brainly_db_cache");
            if (!cachedData) return;

            let parsed = [];
            try { parsed = JSON.parse(cachedData); } catch(e) { return; }

            const grouped = groupDatabaseIntoPackages(parsed);
            const foundPackage = grouped.find(p => 
                p.displayTopic.trim().toLowerCase() === topic.trim().toLowerCase() &&
                (!market || p.marketKey.toUpperCase() === market.toUpperCase())
            );

            if (!foundPackage) return;

            currentPackageObj = foundPackage;
            const packageKey = `${foundPackage.displayTopic.toLowerCase()}____${foundPackage.marketKey.toUpperCase()}`;

            // Płynne przełączenie ekranów w głównym kontenerze
            document.getElementById("initial-placeholder").style.display = "none";
            document.getElementById("results-section").style.display = "none";
            document.querySelector(".bottom-search-wrapper").style.display = "none";
            document.getElementById("inline-package-view").style.display = "block";

            // Render Header Content
            const headerTarget = document.getElementById("package-inline-header-content");
            const tasksTarget = document.getElementById("tasks-list-target");

            const isExam = Array.from(foundPackage.subjects).some(s => s.toLowerCase() === 'exam') || foundPackage.levels.has('EXAM');
            const marketLabel = (typeof MARKET_MAP !== 'undefined' && MARKET_MAP[foundPackage.marketKey]) || foundPackage.marketKey;
            let badgesHtml = `<span class="badge badge-market">${escapeHtml(marketLabel)}</span>`;

            if (isExam) {
                badgesHtml += `<span class="badge badge-exam">EXAM RESOURCE</span>`;
            } else {
                foundPackage.levels.forEach(l => {
                    const lLabel = (typeof LEVEL_MAP !== 'undefined' && LEVEL_MAP[l]) || l;
                    badgesHtml += `<span class="badge badge-level">${escapeHtml(lLabel)}</span>`;
                });
            }

            foundPackage.subjects.forEach(s => {
                badgesHtml += `<span class="badge badge-subject">${escapeHtml(s)}</span>`;
            });

            headerTarget.innerHTML = `
                <div class="package-header-top">
                    <div>
                        <div class="package-badges">${badgesHtml}</div>
                        <h1 class="package-header-title">${escapeHtml(foundPackage.displayTopic)}</h1>
                        <p style="margin: 0; font-size: 0.825rem; color: var(--text-muted);">Total task resources: <strong style="color: var(--text-main);">${foundPackage.structuredLinks.length}</strong></p>
                    </div>
                    <div class="package-actions">
                        <button id="btn-fav-toggle" class="btn-action-icon" title="Toggle Favorite" onclick="toggleFavorite('${escapeHtml(foundPackage.displayTopic)}', '${escapeHtml(foundPackage.marketKey)}')"></button>
                    </div>
                </div>
            `;

            updateFavButtonUI(foundPackage.displayTopic, foundPackage.marketKey);

            // Render Tasks
            tasksTarget.innerHTML = "";
            foundPackage.structuredLinks.forEach((linkObj, idx) => {
                const itemDiv = document.createElement("div");
                itemDiv.className = "task-item-card";
                itemDiv.id = `task-card-${idx}`;

                const finalTaskTitle = (linkObj.title && !linkObj.title.startsWith("Task #")) 
                    ? linkObj.title 
                    : (linkObj.category || `Task ${idx + 1}`);

                itemDiv.innerHTML = `
                    <div class="task-item-left">
                        <label class="custom-chk-container">
                            <input type="checkbox" id="task-chk-${idx}" onchange="toggleTaskCompletion('${escapeHtml(packageKey)}', '${escapeHtml(linkObj.url)}')">
                            <span class="checkmark-circle">
                                <svg class="checkmark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </span>
                        </label>
                        <span class="task-item-title">${escapeHtml(finalTaskTitle)}</span>
                    </div>
                    <a href="${escapeHtml(linkObj.url)}" target="_blank" rel="noopener noreferrer" class="btn-task-link">
                        <span>Solve</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                    </a>
                `;
                tasksTarget.appendChild(itemDiv);
            });

            renderProgressUI(packageKey);
        }

        // PRZECHWYTYWANIE KLIKNIĘĆ PRZYCISKU OPEN I NADPISYWANIE LINKU HUB-PACKAGE.HTML NA WIDOK IN-LINE
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.btn-open-package');
            if (btn && btn.getAttribute('href') && btn.getAttribute('href').includes('hub-package.html')) {
                e.preventDefault();
                const url = new URL(btn.href, window.location.origin);
                const topic = url.searchParams.get('topic');
                const market = url.searchParams.get('market');
                if (topic) {
                    openPackageDetails(topic, market);
                }
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            updateFavBadge();
        });
    </script>
</body>
</html>
