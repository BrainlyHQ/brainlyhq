<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainlyHub - Search Engine & Database</title>

    <link rel="icon" type="image/png" href="assets/Brainly Hub.png">
    <link rel="stylesheet" href="css/style.css">

    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-hover: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --border-focus: #cbd5e1;
            
            --color-brainly-green: #3da80a;
            --color-brainly-green-hover: #2e8207;
            --color-brainly-green-light: #f0fdf4;
            --color-brainly-green-border: #bbf7d0;

            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.06), 0 4px 6px -4px rgba(0, 0, 0, 0.04);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-pill: 9999px;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .hub-container {
            max-width: 1080px;
            margin: 0 auto;
            padding: 48px 24px 80px 24px;
            width: 100%;
            box-sizing: border-box;
            flex-grow: 1;
        }

        /* --- HERO & SEARCH SECTION --- */
        .hero-search-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background-color: var(--color-brainly-green-light);
            border: 1px solid var(--color-brainly-green-border);
            color: var(--color-brainly-green);
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: var(--radius-pill);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            letter-spacing: -0.025em;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .hero-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            margin: 0 0 32px 0;
            font-weight: 400;
        }

        /* SEARCH BAR (CHATGPT / GEMINI STYLE) */
        .ai-search-box {
            position: relative;
            max-width: 760px;
            margin: 0 auto;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 6px 12px;
            box-shadow: var(--shadow-md);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
        }

        .ai-search-box:focus-within {
            border-color: var(--color-brainly-green);
            box-shadow: 0 0 0 3px rgba(61, 168, 10, 0.12), var(--shadow-md);
        }

        .search-icon-svg {
            width: 20px;
            height: 20px;
            color: var(--text-muted);
            margin-left: 10px;
            flex-shrink: 0;
        }

        .ai-search-input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 14px 14px;
            font-size: 1rem;
            color: var(--text-primary);
            font-family: inherit;
            outline: none;
        }

        .ai-search-input::placeholder {
            color: var(--text-muted);
        }

        .clear-search-btn {
            background: var(--bg-hover);
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0;
            flex-shrink: 0;
            margin-right: 6px;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .clear-search-btn:hover {
            background: #ef4444;
            color: #ffffff;
        }

        /* FILTERS */
        .filters-wrapper {
            max-width: 760px;
            margin: 16px auto 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            text-align: left;
        }

        @media (max-width: 650px) {
            .filters-wrapper { grid-template-columns: 1fr; }
            .hero-title { font-size: 2rem; }
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-left: 2px;
        }

        .filter-select {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 36px 10px 12px;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 14px 14px;
            box-shadow: var(--shadow-sm);
        }

        .filter-select:hover, .filter-select:focus {
            border-color: var(--border-focus);
        }

        /* METRICS BAR & FAVORITES */
        .engine-metrics-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 32px;
        }

        .engine-metrics-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 8px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-pill);
            flex-wrap: wrap;
            box-shadow: var(--shadow-sm);
        }

        .metric-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8125rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .metric-item strong {
            color: var(--text-primary);
            font-weight: 700;
        }

        .metric-divider {
            width: 4px;
            height: 4px;
            background: var(--border-color);
            border-radius: 50%;
        }

        .btn-favorites-circle {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: #ef4444;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }

        .btn-favorites-circle:hover {
            border-color: #fca5a5;
            background-color: #fef2f2;
            transform: translateY(-1px);
        }

        .fav-badge-count {
            position: absolute;
            top: -3px;
            right: -3px;
            background: #ef4444;
            color: #ffffff;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: var(--radius-pill);
            border: 2px solid var(--bg-primary);
        }

        /* --- FEATURED & RESULTS SECTIONS --- */
        .featured-section {
            margin-top: 48px;
        }

        .featured-title {
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .featured-title-icon {
            width: 16px;
            height: 16px;
            color: var(--color-brainly-green);
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        /* CARDS */
        .package-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
            position: relative;
            box-shadow: var(--shadow-sm);
        }

        .package-card:hover {
            border-color: var(--border-focus);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .package-card-featured {
            border-color: var(--color-brainly-green-border);
            background: linear-gradient(180deg, #ffffff 0%, var(--color-brainly-green-light) 100%);
        }

        .package-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .badge {
            font-size: 0.6875rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: var(--radius-sm);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .badge-market { background: var(--color-brainly-green-light); color: var(--color-brainly-green); border: 1px solid var(--color-brainly-green-border); }
        .badge-level { background: #f1f5f9; color: #475569; }
        .badge-subject { background: #eff6ff; color: #2563eb; }
        .badge-exam { background: #fffbeb; color: #d97706; }

        .package-topic {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.4;
            color: var(--text-primary);
        }

        .btn-open-package {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 10px 14px;
            background-color: var(--color-brainly-green);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.875rem;
            border-radius: var(--radius-sm);
            transition: background-color 0.15s ease;
            box-sizing: border-box;
        }

        .btn-open-package:hover {
            background-color: var(--color-brainly-green-hover);
        }

        .results-section {
            margin-top: 48px;
            display: none;
            animation: fadeIn 0.2s ease-out forwards;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .results-title {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }

        .results-count {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* FAVORITES MODAL */
        .fav-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .fav-modal-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            max-width: 480px;
            width: 90%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        .fav-modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .fav-modal-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }

        .btn-close-modal {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.25rem;
            cursor: pointer;
            transition: color 0.15s ease;
            line-height: 1;
            padding: 4px;
        }

        .btn-close-modal:hover {
            color: var(--text-primary);
        }

        .fav-modal-body {
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .fav-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            gap: 12px;
        }

        .fav-item-topic {
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-primary);
        }

        .fav-item-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-fav-remove {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #ef4444;
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 0;
            flex-shrink: 0;
        }

        .btn-fav-remove:hover {
            background: #ef4444;
            color: #ffffff;
            border-color: #ef4444;
        }
    </style>

    <script src="js/theme.js"></script>
    <script src="js/hub-render.js"></script>
    <script src="js/hub-engine.js"></script>
</head>
<body>

    <main class="hub-container">
        <section class="hero-search-section">
            <div class="hero-badge">Brainly Hub Database</div>
            <h1 class="hero-title">Search Question Packages</h1>
            <p class="hero-subtitle">Access global task resources, regional exams, and curated topic packages</p>

            <div class="ai-search-box">
                <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="ai-search-input" class="ai-search-input" placeholder="Search by topic, exam or keyword..." autocomplete="off">
                <button id="clear-search-btn" class="clear-search-btn" title="Clear search">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <div class="filters-wrapper">
                <div class="filter-group">
                    <label class="filter-label" for="filter-market">Market / Region</label>
                    <select id="filter-market" class="filter-select">
                        <option value="">All Markets</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label" for="filter-level">Education Level</label>
                    <select id="filter-level" class="filter-select">
                        <option value="">All Levels</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label" for="filter-subject">Subject</label>
                    <select id="filter-subject" class="filter-select">
                        <option value="">All Subjects</option>
                    </select>
                </div>
            </div>

            <div class="engine-metrics-wrapper">
                <div class="engine-metrics-bar">
                    <div class="metric-item">
                        <span>Packages:</span>
                        <strong id="stat-packages-count">0</strong>
                    </div>
                    <div class="metric-divider"></div>
                    <div class="metric-item">
                        <span>Links:</span>
                        <strong id="stat-links-count">0</strong>
                    </div>
                    <div class="metric-divider"></div>
                    <div class="metric-item">
                        <span>Markets:</span>
                        <strong id="stat-markets-count">11</strong>
                    </div>
                    <div class="metric-divider"></div>
                    <div class="metric-item">
                        <span>Subjects:</span>
                        <strong id="stat-subjects-count">30</strong>
                    </div>
                    <div class="metric-divider"></div>
                    <div class="metric-item">
                        <span>Levels:</span>
                        <strong id="stat-levels-count">5</strong>
                    </div>
                </div>

                <!-- HEART BUTTON FOR FAVORITES -->
                <button id="btn-open-favs" class="btn-favorites-circle" title="View Favorite Packages" onclick="openFavModal()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <span id="fav-count-badge" class="fav-badge-count">0</span>
                </button>
            </div>
        </section>

        <div id="initial-placeholder" class="featured-section">
            <h3 class="featured-title">
                <svg class="featured-title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
                Popular &amp; Latest Additions
            </h3>
            <div id="featured-packages-grid" class="packages-grid"></div>
        </div>

        <section id="results-section" class="results-section">
            <div class="results-header">
                <h3 class="results-title">Question Database</h3>
                <span id="results-count-text" class="results-count">0 packages found</span>
            </div>

            <div id="packages-container" class="packages-grid"></div>
        </section>
    </main>

    <!-- FAVORITES MODAL -->
    <div id="fav-modal" class="fav-modal-overlay">
        <div class="fav-modal-card">
            <div class="fav-modal-header">
                <h3 class="fav-modal-title">Favorite Packages</h3>
                <button class="btn-close-modal" onclick="closeFavModal()">&times;</button>
            </div>
            <div id="fav-modal-list" class="fav-modal-body">
                <p style="color: var(--text-secondary); text-align: center; font-size: 0.875rem;">No favorite packages saved yet.</p>
            </div>
        </div>
    </div>

    <script>
        function escapeHtml(str) {
            if (!str) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function getFavs() {
            try { return JSON.parse(localStorage.getItem("brainly_favorites")) || []; } catch(e) { return []; }
        }

        function updateFavBadge() {
            const favs = getFavs();
            const badge = document.getElementById("fav-count-badge");
            if (badge) badge.textContent = favs.length;
        }

        function openFavModal() {
            const modal = document.getElementById("fav-modal");
            const listTarget = document.getElementById("fav-modal-list");
            const favs = getFavs();

            if (favs.length === 0) {
                listTarget.innerHTML = `<p style="color: var(--text-secondary); text-align: center; font-size: 0.875rem;">No favorite packages saved yet.</p>`;
            } else {
                listTarget.innerHTML = "";
                favs.forEach(f => {
                    const row = document.createElement("div");
                    row.className = "fav-item-row";
                    const packageUrl = `hub-package.html?topic=${encodeURIComponent(f.topic)}&market=${encodeURIComponent(f.market)}`;
                    
                    row.innerHTML = `
                        <span class="fav-item-topic">${escapeHtml(f.topic)} (${escapeHtml(f.market)})</span>
                        <div class="fav-item-actions">
                            <a href="${packageUrl}" class="btn-open-package" style="padding: 6px 12px; font-size: 0.78rem;">Open</a>
                            <button class="btn-fav-remove" title="Remove package" onclick="removeFavFromModal('${escapeHtml(f.topic)}', '${escapeHtml(f.market)}')">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                            </button>
                        </div>
                    `;
                    listTarget.appendChild(row);
                });
            }
            modal.style.display = "flex";
        }

        function closeFavModal() {
            document.getElementById("fav-modal").style.display = "none";
        }

        function removeFavFromModal(topic, market) {
            let favs = getFavs();
            favs = favs.filter(f => !(f.topic.toLowerCase() === topic.toLowerCase() && f.market.toUpperCase() === market.toUpperCase()));
            localStorage.setItem("brainly_favorites", JSON.stringify(favs));
            updateFavBadge();
            openFavModal();
        }

        document.addEventListener("DOMContentLoaded", () => {
            updateFavBadge();
        });
    </script>
</body>
</html>
