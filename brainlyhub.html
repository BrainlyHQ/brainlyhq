<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainlyHub - Search Engine & Database</title>

    <script>
        (function() {
            const sessionUser = sessionStorage.getItem("brainly_hub_user");
            if (!sessionUser) {
                window.location.replace("hub.html");
            }
        })();
    </script>

    <link rel="icon" type="image/png" href="assets/Brainly Hub.png">
    <link rel="stylesheet" href="css/style.css">

    <style>
        #header-placeholder, #footer-placeholder {
            display: none !important;
        }

        :root {
            --neon-glow-primary: rgba(153, 238, 96, 0.22);
            --grid-line-color: rgba(255, 255, 255, 0.025);
        }

        [data-theme="light"] {
            --grid-line-color: rgba(0, 0, 0, 0.025);
            --neon-glow-primary: rgba(153, 238, 96, 0.35);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-primary, sans-serif);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(var(--grid-line-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line-color) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-glow-top {
            position: fixed; top: -200px; left: 50%;
            transform: translateX(-50%);
            width: 850px; height: 450px;
            background: radial-gradient(circle, var(--color-brainly-green) 0%, transparent 70%);
            opacity: 0.16; filter: blur(100px);
            pointer-events: none; z-index: 0;
            animation: glowPulse 8s ease-in-out infinite alternate;
        }

        .ambient-glow-left {
            position: fixed; top: 30%; left: -200px;
            width: 500px; height: 500px;
            background: radial-gradient(circle, var(--color-brainly-green) 0%, transparent 75%);
            opacity: 0.08; filter: blur(110px);
            pointer-events: none; z-index: 0;
        }

        .ambient-glow-right {
            position: fixed; bottom: 10%; right: -200px;
            width: 550px; height: 550px;
            background: radial-gradient(circle, var(--color-brainly-green) 0%, transparent 75%);
            opacity: 0.09; filter: blur(120px);
            pointer-events: none; z-index: 0;
        }

        @keyframes glowPulse {
            0% { opacity: 0.12; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 0.20; transform: translateX(-50%) scale(1.05); }
        }

        .hub-navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 32px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(12px);
        }

        .hub-brand {
            display: flex; align-items: center; gap: 12px;
            text-decoration: none;
        }

        .hub-brand img { height: 32px; width: auto; }

        .hub-brand-title {
            font-size: 1.1rem; font-weight: 900;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .hub-user-panel { display: flex; align-items: center; gap: 16px; }

        .user-badge {
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: var(--bg-primary);
            padding: 6px 14px; border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .user-badge strong { color: var(--color-brainly-green); }

        .btn-hub-logout {
            background: transparent;
            border: 1px solid #ff4a4a; color: #ff4a4a;
            padding: 6px 14px; border-radius: 8px;
            font-size: 0.8rem; font-weight: 700;
            cursor: pointer; transition: all 0.2s ease;
        }

        .btn-hub-logout:hover { background: #ff4a4a; color: #ffffff; }

        .hub-container {
            max-width: 1100px; margin: 0 auto;
            padding: 60px 24px 80px 24px;
            width: 100%; box-sizing: border-box;
            flex-grow: 1; position: relative; z-index: 1;
        }

        .hero-search-section { text-align: center; margin-bottom: 30px; }

        .hero-title {
            font-size: 2.8rem; font-weight: 900; margin-bottom: 10px;
            letter-spacing: -1px;
            background: linear-gradient(180deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .hero-subtitle { font-size: 1rem; color: var(--text-secondary); margin-bottom: 36px; }

        .ai-search-box {
            position: relative; max-width: 800px; margin: 0 auto;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 22px; padding: 8px 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; align-items: center;
        }

        .ai-search-box:focus-within {
            border-color: var(--color-brainly-green);
            box-shadow: 0 0 25px var(--neon-glow-primary), 0 10px 30px rgba(0,0,0,0.3);
            transform: translateY(-2px);
        }

        .search-icon-svg {
            width: 24px; height: 24px;
            color: var(--text-secondary);
            margin-left: 8px; flex-shrink: 0;
        }

        .ai-search-input {
            width: 100%; border: none; background: transparent;
            padding: 16px 18px; font-size: 1.1rem;
            color: var(--text-primary); font-family: var(--font-primary);
            outline: none;
        }

        /* NAPRAWIONY PRZYCISK CZYSZCZENIA FRAZY (IDEALNIE OKRĄGŁY) */
        .clear-search-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
            line-height: 1;
            width: 28px;
            height: 28px;
            min-width: 28px;
            min-height: 28px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 0 2px 0;
            box-sizing: border-box;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .clear-search-btn:hover { background: #ff4a4a; color: #ffffff; }

        .filters-wrapper {
            max-width: 800px; margin: 20px auto 0 auto;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            text-align: left;
        }

        @media (max-width: 650px) { .filters-wrapper { grid-template-columns: 1fr; } }

        .filter-group { display: flex; flex-direction: column; gap: 6px; }

        .filter-label {
            font-size: 0.72rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.6px; color: var(--text-secondary); margin-left: 4px;
        }

        .filter-select {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 14px; border-radius: 12px;
            font-family: var(--font-primary); font-size: 0.88rem;
            outline: none; transition: all 0.25s ease;
            width: 100%; box-sizing: border-box; cursor: pointer;
        }

        .filter-select:disabled {
            opacity: 0.45; cursor: not-allowed; border-style: dashed;
        }

        .filter-select:focus:not(:disabled) { border-color: var(--color-brainly-green); }

        .engine-metrics-bar {
            display: flex; justify-content: center; align-items: center;
            gap: 20px; margin-top: 36px; padding: 10px 24px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 30px; max-width: fit-content;
            margin-left: auto; margin-right: auto;
            flex-wrap: wrap; box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
        }

        .metric-item {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.8rem; color: var(--text-secondary); font-weight: 600;
        }

        .metric-item strong { color: var(--color-brainly-green); font-size: 0.92rem; font-weight: 900; }

        .metric-divider { width: 4px; height: 4px; background: var(--border-color); border-radius: 50%; }

        .results-section { margin-top: 40px; display: none; animation: fadeIn 0.3s ease-out forwards; }

        .results-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px; padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .results-title { font-size: 1.1rem; font-weight: 800; margin: 0; }
        .results-count { font-size: 0.85rem; color: var(--text-secondary); font-weight: 600; }

        .packages-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }

        .package-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px; padding: 24px;
            display: flex; flex-direction: column; justify-content: space-between;
            transition: all 0.25s ease; position: relative; overflow: hidden;
        }

        .package-card:hover {
            transform: translateY(-4px); border-color: rgba(153, 238, 96, 0.5);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .package-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }

        .badge {
            font-size: 0.68rem; font-weight: 800; padding: 4px 8px;
            border-radius: 6px; text-transform: uppercase; letter-spacing: 0.4px;
        }

        .badge-market { background: rgba(153, 238, 96, 0.15); color: var(--color-brainly-green); }
        .badge-level { background: rgba(255, 255, 255, 0.08); color: var(--text-primary); }
        .badge-subject { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .badge-exam { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }

        .package-topic { font-size: 1.15rem; font-weight: 800; margin-bottom: 20px; line-height: 1.4; color: var(--text-primary); }

        .package-links-container { display: flex; flex-direction: column; gap: 8px; }

        .btn-open-package {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 10px 14px; background-color: var(--color-brainly-green);
            color: #000000; text-decoration: none; font-weight: 800; font-size: 0.82rem;
            border-radius: 8px; transition: transform 0.2s ease, opacity 0.2s ease;
            box-sizing: border-box;
        }

        .btn-open-package:hover { opacity: 0.92; transform: scale(0.99); }

        .placeholder-search-state {
            text-align: center; padding: 60px 20px; color: var(--text-secondary);
            border: 1px dashed var(--border-color); border-radius: 20px;
            background: rgba(255,255,255,0.01); margin-top: 40px;
        }

        .placeholder-icon { width: 48px; height: 48px; color: var(--text-secondary); margin-bottom: 12px; opacity: 0.85; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <script src="js/theme.js"></script>
    <script src="js/hub-render.js"></script>
</head>
<body>

    <div class="ambient-glow-top"></div>
    <div class="ambient-glow-left"></div>
    <div class="ambient-glow-right"></div>

    <header class="hub-navbar">
        <a href="#" class="hub-brand">
            <img id="hub-nav-logo" src="assets/Brainly Hub White.png" alt="BrainlyHub Logo">
            <span class="hub-brand-title">BrainlyHub Engine</span>
        </a>

        <div class="hub-user-panel">
            <div class="user-badge">
                User: <strong id="hub-username-display">--</strong>
            </div>
            <button id="hub-logout-btn" class="btn-hub-logout">Log Out</button>
        </div>
    </header>

    <main class="hub-container">
        <section class="hero-search-section">
            <h1 class="hero-title">Search Question Packages</h1>
            <p class="hero-subtitle">Access global task resources, regional exams, and topic packages</p>

            <div class="ai-search-box">
                <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="ai-search-input" class="ai-search-input" placeholder="Search by phrase (e.g. 'Matura 2026', 'Trigonometry')..." autocomplete="off">
                <button id="clear-search-btn" class="clear-search-btn" title="Clear search">&times;</button>
            </div>

            <div class="filters-wrapper">
                <div class="filter-group">
                    <label class="filter-label" for="filter-market">Market / Region</label>
                    <select id="filter-market" class="filter-select">
                        <option value="">All Markets</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label" for="filter-level">Education Level</label>
                    <select id="filter-level" class="filter-select">
                        <option value="">All Levels</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label" for="filter-subject">Subject</label>
                    <select id="filter-subject" class="filter-select">
                        <option value="">All Subjects</option>
                    </select>
                </div>
            </div>

            <div class="engine-metrics-bar">
                <div class="metric-item">
                    <span>Packages:</span>
                    <strong id="stat-packages-count">0</strong>
                </div>
                <div class="metric-divider"></div>
                <div class="metric-item">
                    <span>Markets:</span>
                    <strong id="stat-markets-count">0</strong>
                </div>
                <div class="metric-divider"></div>
                <div class="metric-item">
                    <span>Subjects:</span>
                    <strong id="stat-subjects-count">0</strong>
                </div>
                <div class="metric-divider"></div>
                <div class="metric-item">
                    <span>Levels:</span>
                    <strong id="stat-levels-count">0</strong>
                </div>
            </div>
        </section>

        <div id="initial-placeholder" class="placeholder-search-state">
            <svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <h3 style="margin: 0 0 6px 0; font-size: 1.1rem; color: var(--text-primary);">Ready to Search</h3>
            <p style="margin: 0; font-size: 0.88rem;">Type a query or select filters above to search the database.</p>
        </div>

        <section id="results-section" class="results-section">
            <div class="results-header">
                <h3 class="results-title">
                    <span>Question Database</span>
                </h3>
                <span id="results-count-text" class="results-count">0 packages found</span>
            </div>

            <div id="packages-container" class="packages-grid"></div>
        </section>
    </main>

    <script>
        const DATABASE_API_URL = "https://script.google.com/macros/s/AKfycbxHhEiT7YPjUtG6XYq8n4HGew8INj6osdogMd5YxQb6iwKv3iVuzOYaAWDEHS4uvCFS/exec";

        let fullDatabase = [];

        const usernameDisplay = document.getElementById("hub-username-display");
        const logoutBtn = document.getElementById("hub-logout-btn");
        const navLogoImg = document.getElementById("hub-nav-logo");

        const searchInput = document.getElementById("ai-search-input");
        const clearSearchBtn = document.getElementById("clear-search-btn");
        const filterMarket = document.getElementById("filter-market");
        const filterLevel = document.getElementById("filter-level");
        const filterSubject = document.getElementById("filter-subject");

        const initialPlaceholder = document.getElementById("initial-placeholder");
        const resultsSection = document.getElementById("results-section");
        const packagesContainer = document.getElementById("packages-container");
        const resultsCountText = document.getElementById("results-count-text");

        const statPackages = document.getElementById("stat-packages-count");
        const statMarkets = document.getElementById("stat-markets-count");
        const statSubjects = document.getElementById("stat-subjects-count");
        const statLevels = document.getElementById("stat-levels-count");

        function updateLogoTheme() {
            const currentTheme = document.documentElement.getAttribute("data-theme") || "dark";
            if (navLogoImg) {
                navLogoImg.src = currentTheme === "light" ? "assets/Brainly Hub.png" : "assets/Brainly Hub White.png";
            }
        }

        const themeObserver = new MutationObserver(() => updateLogoTheme());
        themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

        const sessionUser = sessionStorage.getItem("brainly_hub_user");
        if (usernameDisplay) usernameDisplay.textContent = sessionUser || "User";

        logoutBtn.addEventListener("click", () => {
            sessionStorage.removeItem("brainly_hub_user");
            window.location.replace("hub.html");
        });

        function fetchDatabaseJSONP() {
            return new Promise((resolve, reject) => {
                const callbackName = 'jsonp_db_' + Math.round(100000 * Math.random());
                const script = document.createElement('script');

                window[callbackName] = function(data) {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    resolve(data);
                };

                script.onerror = function() {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    reject(new Error('JSONP Database fetch failed'));
                };

                script.src = `${DATABASE_API_URL}?callback=${callbackName}`;
                document.body.appendChild(script);
            });
        }

        async function loadDatabase() {
            try {
                const response = await fetchDatabaseJSONP();
                if (response && response.success && response.data) {
                    fullDatabase = response.data;
                    populateAllFilterDropdowns(fullDatabase);
                    updateEngineMetrics(fullDatabase);
                }
            } catch (err) {
                console.error("Database error:", err);
            }
        }

        function populateAllFilterDropdowns(data) {
            // Czyszczenie starych opcji przy zachowaniu pierwszej opcji zbiorczej
            filterMarket.innerHTML = '<option value="">All Markets</option>';
            filterLevel.innerHTML = '<option value="">All Levels</option>';
            filterSubject.innerHTML = '<option value="">All Subjects</option>';

            const markets = new Set();
            const levels = new Set();
            const subjects = new Set();

            data.forEach(item => {
                if (item.market) markets.add(String(item.market).trim().toUpperCase());
                if (item.level) levels.add(String(item.level).trim().toUpperCase());
                if (item.subject) subjects.add(String(item.subject).trim());
            });

            markets.forEach(mKey => {
                if(!mKey) return;
                const opt = document.createElement("option");
                opt.value = mKey;
                opt.textContent = MARKET_MAP[mKey] ? `${mKey} - ${MARKET_MAP[mKey]}` : mKey;
                filterMarket.appendChild(opt);
            });

            levels.forEach(lKey => {
                if(!lKey) return;
                const opt = document.createElement("option");
                opt.value = lKey;
                opt.textContent = LEVEL_MAP[lKey] || lKey;
                filterLevel.appendChild(opt);
            });

            Array.from(subjects).sort((a,b) => a.localeCompare(b)).forEach(s => {
                if(!s) return;
                const opt = document.createElement("option");
                opt.value = s;
                opt.textContent = s;
                filterSubject.appendChild(opt);
            });
        }

        function updateEngineMetrics(data) {
            const grouped = groupDatabaseIntoPackages(data);
            const markets = new Set(data.map(i => i.market ? i.market.trim().toUpperCase() : "").filter(Boolean));
            const subjects = new Set(data.map(i => i.subject ? i.subject.trim().toLowerCase() : "").filter(Boolean));
            const levels = new Set(data.map(i => i.level ? i.level.trim().toUpperCase() : "").filter(Boolean));

            statPackages.textContent = grouped.length;
            statMarkets.textContent = markets.size;
            statSubjects.textContent = subjects.size;
            statLevels.textContent = levels.size;
        }

        function handleSubjectChange() {
            const isExam = filterSubject.value.trim().toLowerCase() === "exam";

            if (isExam) {
                filterLevel.value = "";
                filterLevel.disabled = true;
                filterLevel.options[0].textContent = "N/A (Exam Level)";
            } else {
                filterLevel.disabled = false;
                filterLevel.options[0].textContent = "All Levels";
            }

            filterData();
        }

        function filterData() {
            const query = searchInput.value.trim().toLowerCase();
            const selectedMarket = filterMarket.value.toUpperCase();
            const selectedLevel = filterLevel.value.toUpperCase();
            const selectedSubject = filterSubject.value;
            const isExamSelected = selectedSubject.trim().toLowerCase() === "exam";

            clearSearchBtn.style.display = query ? "flex" : "none";

            if (!query && !selectedMarket && !selectedLevel && !selectedSubject) {
                initialPlaceholder.style.display = "block";
                resultsSection.style.display = "none";
                return;
            }

            initialPlaceholder.style.display = "none";
            resultsSection.style.display = "block";

            const filteredRawRows = fullDatabase.filter(item => {
                const topic = String(item.topic || "").toLowerCase();
                const market = String(item.market || "").toUpperCase();
                const level = String(item.level || "").toUpperCase();
                const subject = String(item.subject || "");

                const matchesQuery = !query || topic.includes(query) || subject.toLowerCase().includes(query);
                const matchesMarket = !selectedMarket || market === selectedMarket;
                const matchesSubject = !selectedSubject || subject.toLowerCase() === selectedSubject.toLowerCase();
                const matchesLevel = isExamSelected || !selectedLevel || level === selectedLevel;

                return matchesQuery && matchesMarket && matchesLevel && matchesSubject;
            });

            const groupedPackages = groupDatabaseIntoPackages(filteredRawRows);
            renderPackagesGrid(packagesContainer, resultsCountText, groupedPackages);
        }

        searchInput.addEventListener("input", filterData);
        filterMarket.addEventListener("change", filterData);
        filterLevel.addEventListener("change", filterData);
        filterSubject.addEventListener("change", handleSubjectChange);

        clearSearchBtn.addEventListener("click", () => {
            searchInput.value = "";
            filterData();
            searchInput.focus();
        });

        document.addEventListener("DOMContentLoaded", () => {
            updateLogoTheme();
            loadDatabase();
        });
    </script>
</body>
</html>
