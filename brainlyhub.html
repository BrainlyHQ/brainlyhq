<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainlyHub - Search Engine & Database</title>

    <link rel="icon" type="image/png" href="assets/Brainly Hub.png">
    <link rel="stylesheet" href="css/style.css">

    <style>
        :root {
            --bg-app: #f8fafc;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #ffffff;
            --bg-hover: #f1f5f9;
            --bg-active: #e2e8f0;

            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-subtle: #94a3b8;

            --border-subtle: #e2e8f0;
            --border-strong: #cbd5e1;
            
            --accent-green: #3da80a;
            --accent-green-subtle: #f0fdf4;
            --accent-green-border: #bbf7d0;

            --sidebar-width: 260px;
            --sidebar-collapsed-width: 68px;

            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 12px 32px -4px rgba(15, 23, 42, 0.12);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-pill: 9999px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .app-layout {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* --- LEWY PASEK BOCZNY (SIDEBAR) --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            flex-shrink: 0;
            user-select: none;
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
        }

        .sidebar-header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            white-space: nowrap;
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-main);
            letter-spacing: -0.02em;
            transition: opacity 0.2s ease;
        }

        .sidebar.collapsed .brand-name {
            opacity: 0;
            pointer-events: none;
        }

        .toggle-sidebar-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .toggle-sidebar-btn:hover {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        .sidebar-nav {
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
            white-space: nowrap;
            overflow: hidden;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        .nav-item.active {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .nav-label {
            transition: opacity 0.2s ease;
        }

        .sidebar.collapsed .nav-label {
            opacity: 0;
            pointer-events: none;
        }

        .badge-pill {
            margin-left: auto;
            background: var(--bg-active);
            color: var(--text-main);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
        }

        .sidebar.collapsed .badge-pill {
            display: none;
        }

        .sidebar-footer {
            padding: 14px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* --- STATYSTYKI W SIDEBARZE --- */
        .sidebar-stats-card {
            background: var(--bg-hover);
            border-radius: var(--radius-md);
            padding: 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sidebar.collapsed .sidebar-stats-card {
            display: none;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-row strong {
            color: var(--text-main);
            font-weight: 700;
        }

        /* --- GŁÓWNA PRZESTRZEŃ (MAIN CONTENT) --- */
        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .top-header {
            height: 56px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-subtle);
            background: var(--bg-sidebar);
            flex-shrink: 0;
        }

        .top-header-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
        }

        /* OBSZAR PRZEWIJANIA Z WYNIKAMI (GÓRA) */
        .content-scroll-area {
            flex-grow: 1;
            overflow-y: auto;
            padding: 24px 24px 140px 24px;
            scroll-behavior: smooth;
        }

        .content-max-width {
            max-width: 960px;
            margin: 0 auto;
            width: 100%;
        }

        /* CARDS & RESULTS GRID */
        .featured-section {
            margin-top: 10px;
        }

        .section-header-title {
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 16px;
        }

        .package-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
            position: relative;
            box-shadow: var(--shadow-sm);
        }

        .package-card:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .package-card-featured {
            border-color: var(--accent-green-border);
            background: linear-gradient(180deg, #ffffff 0%, var(--accent-green-subtle) 100%);
        }

        .package-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .badge {
            font-size: 0.6875rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: var(--radius-sm);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .badge-market { background: var(--bg-hover); color: var(--text-main); border: 1px solid var(--border-subtle); }
        .badge-level { background: #f1f5f9; color: #475569; }
        .badge-subject { background: #eff6ff; color: #2563eb; }
        .badge-exam { background: #fffbeb; color: #d97706; }

        .package-topic {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.4;
            color: var(--text-main);
        }

        .btn-open-package {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 9px 12px;
            background-color: var(--text-main);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.8125rem;
            border-radius: var(--radius-sm);
            transition: background-color 0.15s ease;
            box-sizing: border-box;
        }

        .btn-open-package:hover {
            background-color: #1e293b;
        }

        .results-section {
            margin-top: 10px;
            display: none;
            animation: fadeIn 0.2s ease-out forwards;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .results-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
        }

        .results-count {
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- PŁYWAJĄCY PASEK WYSZUKIWANIA NA DOLE (PROMPT BAR) --- */
        .bottom-search-wrapper {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, rgba(248, 250, 252, 0) 0%, rgba(248, 250, 252, 0.95) 30%, #f8fafc 100%);
            padding: 16px 24px 24px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 50;
            pointer-events: none;
        }

        .bottom-search-container {
            max-width: 800px;
            width: 100%;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* INTEGRACJA KATEGORII W PASEK WYSZUKIWANIA */
        .filters-inline-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .filters-inline-bar::-webkit-scrollbar {
            display: none;
        }

        .filter-select {
            background-color: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 6px 28px 6px 12px;
            border-radius: var(--radius-pill);
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.15s ease, color 0.15s ease;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 10px center;
            box-shadow: var(--shadow-sm);
            white-space: nowrap;
        }

        .filter-select:hover, .filter-select:focus {
            border-color: var(--border-strong);
            color: var(--text-main);
        }

        .ai-search-box {
            position: relative;
            background-color: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 6px 12px;
            box-shadow: var(--shadow-lg);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
        }

        .ai-search-box:focus-within {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-lg), 0 0 0 2px rgba(15, 23, 42, 0.05);
        }

        .search-icon-svg {
            width: 20px;
            height: 20px;
            color: var(--text-subtle);
            margin-left: 8px;
            flex-shrink: 0;
        }

        .ai-search-input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 12px 12px;
            font-size: 0.95rem;
            color: var(--text-main);
            font-family: inherit;
            outline: none;
        }

        .ai-search-input::placeholder {
            color: var(--text-subtle);
        }

        .clear-search-btn {
            background: var(--bg-hover);
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0;
            flex-shrink: 0;
            margin-right: 4px;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .clear-search-btn:hover {
            background: #ef4444;
            color: #ffffff;
        }

        /* ULUBIONE MODAL */
        .fav-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .fav-modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            max-width: 480px;
            width: 90%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        .fav-modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .fav-modal-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
        }

        .btn-close-modal {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.25rem;
            cursor: pointer;
            line-height: 1;
            padding: 4px;
        }

        .fav-modal-body {
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .fav-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: var(--bg-app);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            gap: 12px;
        }

        .fav-item-topic {
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-main);
        }

        .fav-item-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-fav-remove {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #ef4444;
            width: 30px;
            height: 30px;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
        }

        .btn-fav-remove:hover {
            background: #ef4444;
            color: #ffffff;
        }

        /* UKRYCIE ELEMENTÓW DLA SPÓJNOŚCI STRUKTURY JS */
        .hidden-element {
            display: none !important;
        }
    </style>

    <script src="js/theme.js"></script>
    <script src="js/hub-render.js"></script>
    <script src="js/hub-engine.js"></script>
</head>
<body>

    <div class="app-layout">
        
        <!-- LEWY PASEK BOCZNY (SIDEBAR AI) -->
        <aside class="sidebar" id="sidebar">
            <div>
                <div class="sidebar-header">
                    <div class="sidebar-brand">
                        <div class="brand-icon">
                            <!-- Gwiazdka / Sparkle jak w Gemini / Antigravity -->
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-main);">
                                <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/>
                            </svg>
                        </div>
                        <span class="brand-name">BrainlyHub</span>
                    </div>
                    <button class="toggle-sidebar-btn" onclick="toggleSidebar()" title="Rozwiń / Zwiń panel">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                    </button>
                </div>

                <nav class="sidebar-nav">
                    <!-- Ikona Nowe wyszukiwanie / Chat -->
                    <button class="nav-item active" onclick="resetSearchUI()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        <span class="nav-label">Nowe wyszukiwanie</span>
                    </button>

                    <!-- Ikona Szukaj -->
                    <button class="nav-item" onclick="focusSearchInput()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <span class="nav-label">Szukaj paczek</span>
                    </button>

                    <!-- Ikona Ulubione -->
                    <button id="btn-open-favs" class="nav-item" onclick="openFavModal()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        <span class="nav-label">Ulubione</span>
                        <span id="fav-count-badge" class="badge-pill">0</span>
                    </button>

                    <!-- Ikona Ścieżka nauki / Baza wiedzy -->
                    <button class="nav-item" onclick="alert('Ścieżki nauki zostaną udostępnione wkrótce!')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
                        <span class="nav-label">Ścieżka nauki</span>
                    </button>

                    <!-- Ikona Historia -->
                    <button class="nav-item" onclick="alert('Brak historii wyszukiwania.')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        <span class="nav-label">Historia</span>
                    </button>
                </nav>
            </div>

            <div class="sidebar-footer">
                <div class="sidebar-stats-card">
                    <div class="stats-row"><span>Baza paczek:</span> <strong id="stat-packages-count">0</strong></div>
                    <div class="stats-row"><span>Linki zadań:</span> <strong id="stat-links-count">0</strong></div>
                    <div class="stats-row"><span>Rynki:</span> <strong id="stat-markets-count">11</strong></div>
                    <div class="stats-row"><span>Przedmioty:</span> <strong id="stat-subjects-count">30</strong></div>
                    <div class="stats-row"><span>Poziomy:</span> <strong id="stat-levels-count">5</strong></div>
                </div>
            </div>
        </aside>

        <!-- GŁÓWNY OBSZAR STRONY -->
        <div class="main-wrapper">
            
            <header class="top-header">
                <h2 class="top-header-title">BrainlyHub Central Database</h2>
            </header>

            <!-- OBSZAR WYNIKÓW I PACZEK (NA GÓRZE, PRZEWIJALNY) -->
            <main class="content-scroll-area">
                <div class="content-max-width">
                    
                    <!-- Domyślny widok popularnych paczek -->
                    <div id="initial-placeholder" class="featured-section">
                        <div class="section-header-title">
                            Popular &amp; Latest Additions
                        </div>
                        <div id="featured-packages-grid" class="packages-grid"></div>
                    </div>

                    <!-- Widok wyników wyszukiwania -->
                    <section id="results-section" class="results-section">
                        <div class="results-header">
                            <h3 class="results-title">Question Database</h3>
                            <span id="results-count-text" class="results-count">0 packages found</span>
                        </div>
                        <div id="packages-container" class="packages-grid"></div>
                    </section>

                </div>
            </main>

            <!-- PŁYWAJĄCY PASEK WYSZUKIWARKI I FILTRÓW NA DOLE (AI STYLE) -->
            <div class="bottom-search-wrapper">
                <div class="bottom-search-container">
                    
                    <!-- KATEGORIE / FILTRY W PASEKU -->
                    <div class="filters-inline-bar">
                        <select id="filter-market" class="filter-select">
                            <option value="">All Markets</option>
                        </select>
                        <select id="filter-level" class="filter-select">
                            <option value="">All Levels</option>
                        </select>
                        <select id="filter-subject" class="filter-select">
                            <option value="">All Subjects</option>
                        </select>
                    </div>

                    <!-- POLE WYSZUKIWANIA PROMPT-BAR -->
                    <div class="ai-search-box">
                        <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="ai-search-input" class="ai-search-input" placeholder="Wpisz frazę, temat lub zagadnienie..." autocomplete="off">
                        <button id="clear-search-btn" class="clear-search-btn" title="Clear search">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- OKNO MODALNE ULUBIONYCH -->
    <div id="fav-modal" class="fav-modal-overlay">
        <div class="fav-modal-card">
            <div class="fav-modal-header">
                <h3 class="fav-modal-title">Zapisane paczki</h3>
                <button class="btn-close-modal" onclick="closeFavModal()">&times;</button>
            </div>
            <div id="fav-modal-list" class="fav-modal-body">
                <p style="color: var(--text-muted); text-align: center; font-size: 0.875rem;">Brak zapisanych ulubionych paczek.</p>
            </div>
        </div>
    </div>

    <!-- LOGIKA SIDEBARA I OBSŁUGI ULUBIONYCH -->
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
        }

        function focusSearchInput() {
            const input = document.getElementById('ai-search-input');
            if (input) input.focus();
        }

        function resetSearchUI() {
            const input = document.getElementById('ai-search-input');
            if (input) {
                input.value = '';
                input.dispatchEvent(new Event('input', { bubbles: true }));
            }
            document.getElementById('filter-market').value = '';
            document.getElementById('filter-level').value = '';
            document.getElementById('filter-subject').value = '';
            focusSearchInput();
        }

        function escapeHtml(str) {
            if (!str) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function getFavs() {
            try { return JSON.parse(localStorage.getItem("brainly_favorites")) || []; } catch(e) { return []; }
        }

        function updateFavBadge() {
            const favs = getFavs();
            const badge = document.getElementById("fav-count-badge");
            if (badge) badge.textContent = favs.length;
        }

        function openFavModal() {
            const modal = document.getElementById("fav-modal");
            const listTarget = document.getElementById("fav-modal-list");
            const favs = getFavs();

            if (favs.length === 0) {
                listTarget.innerHTML = `<p style="color: var(--text-muted); text-align: center; font-size: 0.875rem;">Brak zapisanych ulubionych paczek.</p>`;
            } else {
                listTarget.innerHTML = "";
                favs.forEach(f => {
                    const row = document.createElement("div");
                    row.className = "fav-item-row";
                    const packageUrl = `hub-package.html?topic=${encodeURIComponent(f.topic)}&market=${encodeURIComponent(f.market)}`;
                    
                    row.innerHTML = `
                        <span class="fav-item-topic">${escapeHtml(f.topic)} (${escapeHtml(f.market)})</span>
                        <div class="fav-item-actions">
                            <a href="${packageUrl}" class="btn-open-package" style="padding: 6px 12px; font-size: 0.78rem;">Otwórz</a>
                            <button class="btn-fav-remove" title="Usuń z ulubionych" onclick="removeFavFromModal('${escapeHtml(f.topic)}', '${escapeHtml(f.market)}')">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                            </button>
                        </div>
                    `;
                    listTarget.appendChild(row);
                });
            }
            modal.style.display = "flex";
        }

        function closeFavModal() {
            document.getElementById("fav-modal").style.display = "none";
        }

        function removeFavFromModal(topic, market) {
            let favs = getFavs();
            favs = favs.filter(f => !(f.topic.toLowerCase() === topic.toLowerCase() && f.market.toUpperCase() === market.toUpperCase()));
            localStorage.setItem("brainly_favorites", JSON.stringify(favs));
            updateFavBadge();
            openFavModal();
        }

        document.addEventListener("DOMContentLoaded", () => {
            updateFavBadge();
        });
    </script>
</body>
</html>
