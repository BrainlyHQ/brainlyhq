<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainlyHub - Search Engine & Database</title>

    <script>
        (function() {
            const sessionUser = sessionStorage.getItem("brainly_hub_user");
            if (!sessionUser) {
                window.location.replace("hub.html");
            }
        })();
    </script>

    <link rel="icon" type="image/png" href="assets/Brainly Hub.png">
    <link rel="stylesheet" href="css/style.css">

    <style>
        #header-placeholder, #footer-placeholder {
            display: none !important;
        }

        :root {
            --neon-glow-primary: rgba(153, 238, 96, 0.22);
            --grid-line-color: rgba(255, 255, 255, 0.025);
        }

        [data-theme="light"] {
            --grid-line-color: rgba(0, 0, 0, 0.025);
            --neon-glow-primary: rgba(153, 238, 96, 0.35);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-primary, sans-serif);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(var(--grid-line-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line-color) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-glow-top {
            position: fixed; top: -200px; left: 50%;
            transform: translateX(-50%);
            width: 850px; height: 450px;
            background: radial-gradient(circle, var(--color-brainly-green) 0%, transparent 70%);
            opacity: 0.16; filter: blur(100px);
            pointer-events: none; z-index: 0;
            animation: glowPulse 8s ease-in-out infinite alternate;
        }

        .ambient-glow-left {
            position: fixed; top: 30%; left: -200px;
            width: 500px; height: 500px;
            background: radial-gradient(circle, var(--color-brainly-green) 0%, transparent 75%);
            opacity: 0.08; filter: blur(110px);
            pointer-events: none; z-index: 0;
        }

        .ambient-glow-right {
            position: fixed; bottom: 10%; right: -200px;
            width: 550px; height: 550px;
            background: radial-gradient(circle, var(--color-brainly-green) 0%, transparent 75%);
            opacity: 0.09; filter: blur(120px);
            pointer-events: none; z-index: 0;
        }

        @keyframes glowPulse {
            0% { opacity: 0.12; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 0.20; transform: translateX(-50%) scale(1.05); }
        }

        .hub-navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 32px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(12px);
        }

        .hub-brand {
            display: flex; align-items: center; gap: 12px;
            text-decoration: none;
        }

        .hub-brand img { height: 32px; width: auto; }

        .hub-brand-title {
            font-size: 1.1rem; font-weight: 900;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .hub-user-panel { display: flex; align-items: center; gap: 16px; }

        .user-badge {
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: var(--bg-primary);
            padding: 6px 14px; border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .user-badge strong { color: var(--color-brainly-green); }

        .btn-hub-logout {
            background: transparent;
            border: 1px solid #ff4a4a; color: #ff4a4a;
            padding: 6px 14px; border-radius: 8px;
            font-size: 0.8rem; font-weight: 700;
            cursor: pointer; transition: all 0.2s ease;
        }

        .btn-hub-logout:hover { background: #ff4a4a; color: #ffffff; }

        .hub-container {
            max-width: 1100px; margin: 0 auto;
            padding: 60px 24px 80px 24px;
            width: 100%; box-sizing: border-box;
            flex-grow: 1; position: relative; z-index: 1;
        }

        .hero-search-section { text-align: center; margin-bottom: 30px; }

        .hero-title {
            font-size: 2.8rem; font-weight: 900; margin-bottom: 10px;
            letter-spacing: -1px;
            background: linear-gradient(180deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .hero-subtitle { font-size: 1rem; color: var(--text-secondary); margin-bottom: 36px; }

        .ai-search-box {
            position: relative; max-width: 800px; margin: 0 auto;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 22px; padding: 8px 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; align-items: center;
        }

        .ai-search-box:focus-within {
            border-color: var(--color-brainly-green);
            box-shadow: 0 0 25px var(--neon-glow-primary), 0 10px 30px rgba(0,0,0,0.3);
            transform: translateY(-2px);
        }

        .search-icon-svg {
            width: 24px; height: 24px;
            color: var(--text-secondary);
            margin-left: 8px; flex-shrink: 0;
        }

        .ai-search-input {
            width: 100%; border: none; background: transparent;
            padding: 16px 18px; font-size: 1.1rem;
            color: var(--text-primary); font-family: var(--font-primary);
            outline: none;
        }

        .clear-search-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.2s ease;
            flex-shrink: 0;
            margin-right: 4px;
        }

        .clear-search-btn:hover { background: #ff4a4a; color: #ffffff; }

        .filters-wrapper {
            max-width: 800px; margin: 20px auto 0 auto;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            text-align: left;
        }

        @media (max-width: 650px) { .filters-wrapper { grid-template-columns: 1fr; } }

        .filter-group { display: flex; flex-direction: column; gap: 6px; }

        .filter-label {
            font-size: 0.72rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.6px; color: var(--text-secondary); margin-left: 4px;
        }

        .filter-select {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 36px 12px 14px; 
            border-radius: 12px;
            font-family: var(--font-primary); font-size: 0.88rem;
            outline: none; transition: all 0.25s ease;
            width: 100%; box-sizing: border-box; cursor: pointer;
            appearance: auto;
        }

        .engine-metrics-bar {
            display: flex; justify-content: center; align-items: center;
            gap: 16px; margin-top: 36px; padding: 10px 24px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 30px; max-width: fit-content;
            margin-left: auto; margin-right: auto;
            flex-wrap: wrap; box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
        }

        .metric-item {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.8rem; color: var(--text-secondary); font-weight: 600;
        }

        .metric-item strong { color: var(--color-brainly-green); font-size: 0.92rem; font-weight: 900; }
        .metric-divider { width: 4px; height: 4px; background: var(--border-color); border-radius: 50%; }

        .featured-section { margin-top: 40px; }
        
        .featured-title {
            font-size: 1.1rem; font-weight: 900; color: #ff6e00; margin-bottom: 20px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            text-transform: uppercase; letter-spacing: 0.8px;
        }

        .featured-title img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .packages-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }

        .package-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px; padding: 24px;
            display: flex; flex-direction: column; justify-content: space-between;
            transition: all 0.25s ease; position: relative; overflow: hidden;
        }

        .package-card-featured {
            border-color: rgba(255, 110, 0, 0.4);
            background: linear-gradient(145deg, var(--bg-secondary) 0%, rgba(255, 110, 0, 0.03) 100%);
            padding: 28px;
            box-shadow: 0 8px 25px rgba(255, 110, 0, 0.08);
        }

        .package-card-featured .package-topic { font-size: 1.3rem; }

        .package-card:hover {
            transform: translateY(-4px); border-color: rgba(153, 238, 96, 0.5);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .package-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }

        .badge {
            font-size: 0.68rem; font-weight: 800; padding: 4px 8px;
            border-radius: 6px; text-transform: uppercase; letter-spacing: 0.4px;
        }

        .badge-market { background: rgba(153, 238, 96, 0.15); color: var(--color-brainly-green); }
        .badge-level { background: rgba(255, 255, 255, 0.08); color: var(--text-primary); }
        .badge-subject { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .badge-exam { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }

        .package-topic { font-size: 1.15rem; font-weight: 800; margin-bottom: 20px; line-height: 1.4; color: var(--text-primary); }

        .btn-open-package {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 10px 14px; background-color: var(--color-brainly-green);
            color: #000000; text-decoration: none; font-weight: 800; font-size: 0.82rem;
            border-radius: 8px; transition: transform 0.2s ease, opacity 0.2s ease;
            box-sizing: border-box;
        }

        .btn-open-package:hover { opacity: 0.92; transform: scale(0.99); }

        .results-section { margin-top: 40px; display: none; animation: fadeIn 0.3s ease-out forwards; }
        .results-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <script src="js/theme.js"></script>
    <script src="js/hub-render.js"></script>
    <script src="js/hub-engine.js"></script>
</head>
<body>

    <div class="ambient-glow-top"></div>
    <div class="ambient-glow-left"></div>
    <div class="ambient-glow-right"></div>

    <header class="hub-navbar">
        <a href="#" class="hub-brand">
            <img id="hub-nav-logo" src="assets/Brainly Hub.png" alt="BrainlyHub Logo">
            <span class="hub-brand-title">BrainlyHub Engine</span>
        </a>

        <div class="hub-user-panel">
            <div class="user-badge">
                User: <strong id="hub-username-display">--</strong>
            </div>
            <button id="hub-logout-btn" class="btn-hub-logout">Log Out</button>
        </div>
    </header>

    <main class="hub-container">
        <section class="hero-search-section">
            <h1 class="hero-title">Search Question Packages</h1>
            <p class="hero-subtitle">Access global task resources, regional exams, and topic packages</p>

            <div class="ai-search-box">
                <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="ai-search-input" class="ai-search-input" placeholder="Search by phrase (e.g. 'Matura 2026', 'Trigonometry')..." autocomplete="off">
                <button id="clear-search-btn" class="clear-search-btn" title="Clear search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <div class="filters-wrapper">
                <div class="filter-group">
                    <label class="filter-label" for="filter-market">Market / Region</label>
                    <select id="filter-market" class="filter-select">
                        <option value="">All Markets</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label" for="filter-level">Education Level</label>
                    <select id="filter-level" class="filter-select">
                        <option value="">All Levels</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label" for="filter-subject">Subject</label>
                    <select id="filter-subject" class="filter-select">
                        <option value="">All Subjects</option>
                    </select>
                </div>
            </div>

            <div class="engine-metrics-bar">
                <div class="metric-item">
                    <span>Packages:</span>
                    <strong id="stat-packages-count">0</strong>
                </div>
                <div class="metric-divider"></div>
                <div class="metric-item">
                    <span>Links:</span>
                    <strong id="stat-links-count">0</strong>
                </div>
                <div class="metric-divider"></div>
                <div class="metric-item">
                    <span>Markets:</span>
                    <strong id="stat-markets-count">11</strong>
                </div>
                <div class="metric-divider"></div>
                <div class="metric-item">
                    <span>Subjects:</span>
                    <strong id="stat-subjects-count">30</strong>
                </div>
                <div class="metric-divider"></div>
                <div class="metric-item">
                    <span>Levels:</span>
                    <strong id="stat-levels-count">5</strong>
                </div>
            </div>
        </section>

        <!-- WIDOK POCZĄTKOWY: 3 NAJNOWSZE KAFELKI Z IKONĄ FIRE.PNG W NAGŁÓWKU H3 -->
        <div id="initial-placeholder" class="featured-section">
            <h3 class="featured-title">
                <img src="assets/fire.png" alt="Popular"> Popular &amp; Latest Additions
            </h3>
            <div id="featured-packages-grid" class="packages-grid"></div>
        </div>

        <section id="results-section" class="results-section">
            <div class="results-header">
                <h3 class="results-title">
                    <span>Question Database</span>
                </h3>
                <span id="results-count-text" class="results-count">0 packages found</span>
            </div>

            <div id="packages-container" class="packages-grid"></div>
        </section>
    </main>
</body>
</html>
