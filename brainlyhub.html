<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainlyHub - Search Engine & Database</title>

    <!-- NATYCHMIASTOWA WERYFIKACJA SESJI LOGOWANIA -->
    <script>
        (function() {
            const sessionUser = sessionStorage.getItem("brainly_hub_user");
            if (!sessionUser) {
                window.location.replace("hub.html");
            }
        })();
    </script>

    <link rel="icon" type="image/png" href="assets/Brainly Hub.png">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* UKRYCIE GLOBALNEGO HEADEREM I FOOTEREM */
        #header-placeholder, #footer-placeholder {
            display: none !important;
        }

        :root {
            --neon-glow-primary: rgba(153, 238, 96, 0.22);
            --neon-glow-strong: rgba(153, 238, 96, 0.45);
            --grid-line-color: rgba(255, 255, 255, 0.025);
        }

        [data-theme="light"] {
            --grid-line-color: rgba(0, 0, 0, 0.025);
            --neon-glow-primary: rgba(153, 238, 96, 0.35);
            --neon-glow-strong: rgba(153, 238, 96, 0.6);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-primary, sans-serif);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* 1. DELIKATNA SIATKA W TLE */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(var(--grid-line-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line-color) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        /* 2. ZIELONE NEONY WYŁĄCZNIE W TLE */
        .ambient-glow-top {
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 850px;
            height: 450px;
            background: radial-gradient(circle, var(--color-brainly-green) 0%, transparent 70%);
            opacity: 0.16;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            animation: glowPulse 8s ease-in-out infinite alternate;
        }

        .ambient-glow-left {
            position: fixed;
            top: 30%;
            left: -200px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--color-brainly-green) 0%, transparent 75%);
            opacity: 0.08;
            filter: blur(110px);
            pointer-events: none;
            z-index: 0;
        }

        .ambient-glow-right {
            position: fixed;
            bottom: 10%;
            right: -200px;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, var(--color-brainly-green) 0%, transparent 75%);
            opacity: 0.09;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }

        @keyframes glowPulse {
            0% { opacity: 0.12; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 0.20; transform: translateX(-50%) scale(1.05); }
        }

        /* GÓRNY PASEK NAWIGACYJNY */
        .hub-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .hub-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .hub-brand img {
            height: 32px;
            width: auto;
        }

        .hub-brand-title {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .hub-user-panel {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-badge {
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: var(--bg-primary);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .user-badge strong {
            color: var(--color-brainly-green);
        }

        .btn-hub-logout {
            background: transparent;
            border: 1px solid #ff4a4a;
            color: #ff4a4a;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-hub-logout:hover {
            background: #ff4a4a;
            color: #ffffff;
        }

        /* KONTENER STRONY */
        .hub-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 24px 80px 24px;
            width: 100%;
            box-sizing: border-box;
            flex-grow: 1;
            position: relative;
            z-index: 1;
        }

        /* NAGŁÓWEK I SEARCH BOX */
        .hero-search-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero-title {
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 10px;
            letter-spacing: -1px;
            background: linear-gradient(180deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 36px;
        }

        .ai-search-box {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            padding: 8px 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
        }

        .ai-search-box:focus-within {
            border-color: var(--color-brainly-green);
            box-shadow: 0 0 25px var(--neon-glow-primary), 0 10px 30px rgba(0,0,0,0.3);
            transform: translateY(-2px);
        }

        .search-icon-svg {
            width: 24px;
            height: 24px;
            color: var(--text-secondary);
            margin-left: 8px;
            flex-shrink: 0;
        }

        .ai-search-input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 16px 18px;
            font-size: 1.1rem;
            color: var(--text-primary);
            font-family: var(--font-primary);
            outline: none;
        }

        .clear-search-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1rem;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .clear-search-btn:hover {
            background: #ff4a4a;
            color: #fff;
        }

        /* PANELE FILTRÓW */
        .filters-wrapper {
            max-width: 800px;
            margin: 20px auto 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            text-align: left;
        }

        @media (max-width: 650px) {
            .filters-wrapper { grid-template-columns: 1fr; }
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-label {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-secondary);
            margin-left: 4px;
        }

        .filter-select {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 14px;
            border-radius: 12px;
            font-family: var(--font-primary);
            font-size: 0.88rem;
            outline: none;
            transition: all 0.25s ease;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
        }

        .filter-select:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            border-style: dashed;
        }

        .filter-select:focus:not(:disabled) {
            border-color: var(--color-brainly-green);
        }

        /* PASEK METRYK */
        .engine-metrics-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 36px;
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            max-width: fit-content;
            margin-left: auto;
            margin-right: auto;
            flex-wrap: wrap;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--color-brainly-green);
            border-radius: 50%;
        }

        .metric-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .metric-item strong {
            color: var(--color-brainly-green);
            font-size: 0.92rem;
            font-weight: 900;
        }

        .metric-divider {
            width: 4px;
            height: 4px;
            background: var(--border-color);
            border-radius: 50%;
        }

        /* WYNIKI BAZY DANYCH */
        .results-section {
            margin-top: 40px;
            display: none;
            animation: fadeIn 0.3s ease-out forwards;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .results-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .results-count {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .package-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .package-card:hover {
            transform: translateY(-4px);
            border-color: rgba(153, 238, 96, 0.5);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .package-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 14px;
        }

        .badge {
            font-size: 0.68rem;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .badge-market { background: rgba(153, 238, 96, 0.15); color: var(--color-brainly-green); }
        .badge-level { background: rgba(255, 255, 255, 0.08); color: var(--text-primary); }
        .badge-subject { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .badge-exam { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }

        .package-topic {
            font-size: 1.15rem;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.4;
            color: var(--text-primary);
        }

        /* SEKCJACH MULTI-LINKÓW W KARTACH */
        .package-links-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-open-package {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px 14px;
            background-color: var(--color-brainly-green);
            color: #000000;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.82rem;
            border-radius: 8px;
            transition: transform 0.2s ease, opacity 0.2s ease;
            box-sizing: border-box;
        }

        .btn-open-package:hover {
            opacity: 0.92;
            transform: scale(0.99);
        }

        .placeholder-search-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            border: 1px dashed var(--border-color);
            border-radius: 20px;
            background: rgba(255,255,255,0.01);
            margin-top: 40px;
        }

        .placeholder-icon {
            width: 48px;
            height: 48px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            opacity: 0.85;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <script src="js/theme.js"></script>
</head>
<body>

    <div class="ambient-glow-top"></div>
    <div class="ambient-glow-left"></div>
    <div class="ambient-glow-right"></div>

    <!-- GÓRNY PASEK APLIKACJI -->
    <header class="hub-navbar">
        <a href="#" class="hub-brand">
            <img id="hub-nav-logo" src="assets/Brainly Hub White.png" alt="BrainlyHub Logo">
            <span class="hub-brand-title">BrainlyHub Engine</span>
        </a>

        <div class="hub-user-panel">
            <div class="user-badge">
                User: <strong id="hub-username-display">--</strong>
            </div>
            <button id="hub-logout-btn" class="btn-hub-logout">Log Out</button>
        </div>
    </header>

    <!-- GŁÓWNA TREŚĆ STRONY -->
    <main class="hub-container">
        
        <!-- NAGŁÓWEK I WYSZUKIWARKA AI -->
        <section class="hero-search-section">
            <h1 class="hero-title">Search Question Packages</h1>
            <p class="hero-subtitle">Access global task resources, regional exams, and topic packages</p>

            <div class="ai-search-box">
                <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="ai-search-input" class="ai-search-input" placeholder="Search by phrase (e.g. 'Matura 2026', 'Trigonometry')..." autocomplete="off">
                <button id="clear-search-btn" class="clear-search-btn" title="Clear search">&times;</button>
            </div>

            <!-- FILTRY DANYCH -->
            <div class="filters-wrapper">
                <div class="filter-group">
                    <label class="filter-label" for="filter-market">Market / Region</label>
                    <select id="filter-market" class="filter-select">
                        <option value="">All Markets</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label" for="filter-level">Education Level</label>
                    <select id="filter-level" class="filter-select">
                        <option value="">All Levels</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label" for="filter-subject">Subject</label>
                    <select id="filter-subject" class="filter-select">
                        <option value="">All Subjects</option>
                    </select>
                </div>
            </div>

            <!-- PASEK METRYK -->
            <div class="engine-metrics-bar">
                <div class="live-dot" title="Database connection active"></div>
                <div class="metric-item">
                    <span>Packages:</span>
                    <strong id="stat-packages-count">0</strong>
                </div>
                <div class="metric-divider"></div>
                <div class="metric-item">
                    <span>Markets:</span>
                    <strong id="stat-markets-count">0</strong>
                </div>
                <div class="metric-divider"></div>
                <div class="metric-item">
                    <span>Subjects:</span>
                    <strong id="stat-subjects-count">0</strong>
                </div>
                <div class="metric-divider"></div>
                <div class="metric-item">
                    <span>Levels:</span>
                    <strong id="stat-levels-count">0</strong>
                </div>
            </div>
        </section>

        <!-- EKRAN ZACHĘCAJĄCY PRZED WYSZUKANIEM -->
        <div id="initial-placeholder" class="placeholder-search-state">
            <svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <h3 style="margin: 0 0 6px 0; font-size: 1.1rem; color: var(--text-primary);">Ready to Search</h3>
            <p style="margin: 0; font-size: 0.88rem;">Type a query or select filters above to search the database.</p>
        </div>

        <!-- SEKCJA WYNIKÓW (UKRYTA PRZED WYSZUKANIEM) -->
        <section id="results-section" class="results-section">
            <div class="results-header">
                <h3 class="results-title">
                    <span>Question Database</span>
                </h3>
                <span id="results-count-text" class="results-count">0 packages found</span>
            </div>

            <div id="packages-container" class="packages-grid"></div>
        </section>

    </main>

    <script>
        const DATABASE_API_URL = "https://script.google.com/macros/s/AKfycbxHhEiT7YPjUtG6XYq8n4HGew8INj6osdogMd5YxQb6iwKv3iVuzOYaAWDEHS4uvCFS/exec";

        // MOPOWANIE SLOWNIKOW DANYCH (KLUCZ W SHEETS -> CZYTELNA NAZWA INTERFEJSU)
        const MARKET_MAP = {
            "IN": "Indie",
            "ID": "Indonesia",
            "PL": "Polska",
            "LAT": "Ameryka Łacińska",
            "RU": "Znanija",
            "FR": "Nosdevoirs",
            "US": "Brainly.com (USA)",
            "RO": "Rumunia",
            "BR": "Brazylia",
            "PH": "Filipiny",
            "TU": "Turcja"
        };

        const LEVEL_MAP = {
            "EASY": "Łatwy (nauczyciel)",
            "MID": "Średni (student)",
            "HARD": "Trudny (nauczyciel)",
            "SUPER HARD": "Bardzo trudny (profesor)"
        };

        let fullDatabase = [];

        // Elementy DOM
        const usernameDisplay = document.getElementById("hub-username-display");
        const logoutBtn = document.getElementById("hub-logout-btn");
        const navLogoImg = document.getElementById("hub-nav-logo");

        const searchInput = document.getElementById("ai-search-input");
        const clearSearchBtn = document.getElementById("clear-search-btn");
        const filterMarket = document.getElementById("filter-market");
        const filterLevel = document.getElementById("filter-level");
        const filterSubject = document.getElementById("filter-subject");

        const initialPlaceholder = document.getElementById("initial-placeholder");
        const resultsSection = document.getElementById("results-section");
        const packagesContainer = document.getElementById("packages-container");
        const resultsCountText = document.getElementById("results-count-text");

        const statPackages = document.getElementById("stat-packages-count");
        const statMarkets = document.getElementById("stat-markets-count");
        const statSubjects = document.getElementById("stat-subjects-count");
        const statLevels = document.getElementById("stat-levels-count");

        // Motyw Logo
        function updateLogoTheme() {
            const currentTheme = document.documentElement.getAttribute("data-theme") || "dark";
            if (navLogoImg) {
                navLogoImg.src = currentTheme === "light" ? "assets/Brainly Hub.png" : "assets/Brainly Hub White.png";
            }
        }

        const themeObserver = new MutationObserver(() => updateLogoTheme());
        themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

        // Użytkownik
        const sessionUser = sessionStorage.getItem("brainly_hub_user");
        if (usernameDisplay) usernameDisplay.textContent = sessionUser || "User";

        // Wylogowanie
        logoutBtn.addEventListener("click", () => {
            sessionStorage.removeItem("brainly_hub_user");
            window.location.replace("hub.html");
        });

        // ŁADOWANIE DANYCH Z GOOGLE APPS SCRIPT (JSONP)
        function fetchDatabaseJSONP() {
            return new Promise((resolve, reject) => {
                const callbackName = 'jsonp_db_' + Math.round(100000 * Math.random());
                const script = document.createElement('script');

                window[callbackName] = function(data) {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    resolve(data);
                };

                script.onerror = function() {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    reject(new Error('JSONP Database fetch failed'));
                };

                script.src = `${DATABASE_API_URL}?callback=${callbackName}`;
                document.body.appendChild(script);
            });
        }

        async function loadDatabase() {
            try {
                const response = await fetchDatabaseJSONP();
                if (response && response.success && response.data) {
                    fullDatabase = response.data;
                    populateAllFilterDropdowns(fullDatabase);
                    updateEngineMetrics(fullDatabase);
                }
            } catch (err) {
                console.error("Database error:", err);
            }
        }

        // POPULACJA FILTRÓW
        function populateAllFilterDropdowns(data) {
            const markets = new Set();
            const levels = new Set();
            const subjects = new Set();

            data.forEach(item => {
                if (item.market) markets.add(item.market.trim().toUpperCase());
                if (item.level) levels.add(item.level.trim().toUpperCase());
                if (item.subject) subjects.add(item.subject.trim());
            });

            // Markets
            markets.forEach(mKey => {
                const opt = document.createElement("option");
                opt.value = mKey;
                opt.textContent = MARKET_MAP[mKey] ? `${mKey} - ${MARKET_MAP[mKey]}` : mKey;
                filterMarket.appendChild(opt);
            });

            // Education Levels
            levels.forEach(lKey => {
                const opt = document.createElement("option");
                opt.value = lKey;
                opt.textContent = LEVEL_MAP[lKey] || lKey;
                filterLevel.appendChild(opt);
            });

            // Subjects (posortowane alfabetycznie)
            Array.from(subjects).sort((a,b) => a.localeCompare(b)).forEach(s => {
                const opt = document.createElement("option");
                opt.value = s;
                opt.textContent = s;
                filterSubject.appendChild(opt);
            });
        }

        // PRZELICZANIE METRYK BAZY
        function updateEngineMetrics(data) {
            const markets = new Set(data.map(i => i.market ? i.market.trim().toUpperCase() : "").filter(Boolean));
            const subjects = new Set(data.map(i => i.subject ? i.subject.trim().toLowerCase() : "").filter(Boolean));
            const levels = new Set(data.map(i => i.level ? i.level.trim().toUpperCase() : "").filter(Boolean));

            statPackages.textContent = data.length;
            statMarkets.textContent = markets.size;
            statSubjects.textContent = subjects.size;
            statLevels.textContent = levels.size;
        }

        // LOGIKA DLA SEKCJI EXAM ORAZ DYNAMICZNEGO FILTROWANIA
        function handleSubjectChange() {
            const isExam = filterSubject.value.trim().toLowerCase() === "exam";

            if (isExam) {
                filterLevel.value = "";
                filterLevel.disabled = true;
                filterLevel.options[0].textContent = "N/A (Exam Level)";
            } else {
                filterLevel.disabled = false;
                filterLevel.options[0].textContent = "All Levels";
            }

            filterData();
        }

        // INTELIGENTNE FILTROWANIE DANYCH
        function filterData() {
            const query = searchInput.value.trim().toLowerCase();
            const selectedMarket = filterMarket.value.toUpperCase();
            const selectedLevel = filterLevel.value.toUpperCase();
            const selectedSubject = filterSubject.value;
            const isExamSelected = selectedSubject.trim().toLowerCase() === "exam";

            clearSearchBtn.style.display = query ? "flex" : "none";

            // Ukrycie wyników, gdy brak zapytania i brak aktywnych filtrów
            if (!query && !selectedMarket && !selectedLevel && !selectedSubject) {
                initialPlaceholder.style.display = "block";
                resultsSection.style.display = "none";
                return;
            }

            initialPlaceholder.style.display = "none";
            resultsSection.style.display = "block";

            const filtered = fullDatabase.filter(item => {
                const topic = (item.topic || "").toLowerCase();
                const market = (item.market || "").toUpperCase();
                const level = (item.level || "").toUpperCase();
                const subject = (item.subject || "");

                const matchesQuery = !query || topic.includes(query) || subject.toLowerCase().includes(query);
                const matchesMarket = !selectedMarket || market === selectedMarket;
                const matchesSubject = !selectedSubject || subject.toLowerCase() === selectedSubject.toLowerCase();
                
                // Dla przedmiotu Exam poziom trudności jest ignorowany
                const matchesLevel = isExamSelected || !selectedLevel || level === selectedLevel;

                return matchesQuery && matchesMarket && matchesLevel && matchesSubject;
            });

            renderPackages(filtered);
        }

        // PARSER WIELU LINKÓW W POLE LINK (NP. ROZDZIELANYCH PRZECINKAMI, ŚREDNIKAMI LUB NOWĄ LINIA)
        function parseLinks(rawLinkString) {
            if (!rawLinkString) return [];
            return rawLinkString
                .split(/[\n,;]+/)
                .map(l => l.trim())
                .filter(l => l.length > 0 && (l.startsWith("http://") || l.startsWith("https://")));
        }

        function renderPackages(data) {
            packagesContainer.innerHTML = "";
            resultsCountText.textContent = `${data.length} packages found`;

            if (data.length === 0) {
                packagesContainer.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: var(--text-secondary);">
                        <h4>No packages match your search criteria</h4>
                        <p style="font-size: 0.85rem;">Try changing your keywords or resetting filters.</p>
                    </div>
                `;
                return;
            }

            data.forEach(item => {
                const card = document.createElement("div");
                card.className = "package-card";

                const marketKey = (item.market || "").trim().toUpperCase();
                const levelKey = (item.level || "").trim().toUpperCase();
                const rawSubject = (item.subject || "").trim();
                const isExam = rawSubject.toLowerCase() === "exam";

                const marketDisplay = MARKET_MAP[marketKey] ? `${marketKey} (${MARKET_MAP[marketKey]})` : marketKey;
                const levelDisplay = LEVEL_MAP[levelKey] || levelKey;

                const linkList = parseLinks(item.link);

                let linksHtml = "";
                if (linkList.length === 0) {
                    linksHtml = `<span style="font-size:0.8rem; color:var(--text-secondary);">No active link available</span>`;
                } else if (linkList.length === 1) {
                    linksHtml = `
                        <a href="${escapeHtml(linkList[0])}" target="_blank" class="btn-open-package">
                            <span>Open Package</span>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                        </a>
                    `;
                } else {
                    // Generowanie przycisków dla wielu linków w paczce
                    linksHtml = `<div class="package-links-container">`;
                    linkList.forEach((linkUrl, index) => {
                        linksHtml += `
                            <a href="${escapeHtml(linkUrl)}" target="_blank" class="btn-open-package">
                                <span>Task Link #${index + 1}</span>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                            </a>
                        `;
                    });
                    linksHtml += `</div>`;
                }

                card.innerHTML = `
                    <div>
                        <div class="package-badges">
                            ${marketKey ? `<span class="badge badge-market">${escapeHtml(marketDisplay)}</span>` : ''}
                            ${isExam 
                                ? `<span class="badge badge-exam">EXAM RESOURCE</span>` 
                                : (levelKey ? `<span class="badge badge-level">${escapeHtml(levelDisplay)}</span>` : '')
                            }
                            ${rawSubject ? `<span class="badge badge-subject">${escapeHtml(rawSubject)}</span>` : ''}
                        </div>
                        <div class="package-topic">${escapeHtml(item.topic || 'Untitled Package')}</div>
                    </div>
                    <div>
                        ${linksHtml}
                    </div>
                `;

                packagesContainer.appendChild(card);
            });
        }

        // EVENT LISTENERY
        searchInput.addEventListener("input", filterData);
        filterMarket.addEventListener("change", filterData);
        filterLevel.addEventListener("change", filterData);
        filterSubject.addEventListener("change", handleSubjectChange);

        clearSearchBtn.addEventListener("click", () => {
            searchInput.value = "";
            filterData();
            searchInput.focus();
        });

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            updateLogoTheme();
            loadDatabase();
        });
    </script>
</body>
</html>
