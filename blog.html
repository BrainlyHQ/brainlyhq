<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog & Updates - BrainlyHQ</title>
    <link rel="icon" type="image/png" href="assets/BRAINLYHQ LOGO.png">
    <link rel="stylesheet" href="css/style.css">

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#99EE60">

    <style>
        .blog-page-main {
            margin-top: 50px;
            margin-bottom: 60px;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
            padding: 0 24px;
        }

        .blog-filter-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 18px;
            border-radius: 20px;
            font-family: var(--font-primary);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--color-brainly-green);
            color: #000000;
            border-color: var(--color-brainly-green);
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 28px;
        }

        .blog-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            text-decoration: none;
            color: inherit;
        }

        .blog-card:hover {
            transform: translateY(-5px);
            border-color: var(--color-brainly-green);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .blog-card-cover {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: var(--bg-primary);
        }

        .blog-card-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .blog-card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.78rem;
        }

        .blog-card-tag {
            background-color: rgba(153, 238, 96, 0.15);
            color: var(--color-brainly-green);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .blog-card-date {
            color: var(--text-secondary);
            font-family: monospace;
        }

        .blog-card-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 10px;
            line-height: 1.35;
        }

        .blog-card-excerpt {
            color: var(--text-secondary);
            font-size: 0.88rem;
            line-height: 1.5;
            flex: 1;
        }

        .loading-wrapper {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 0;
            color: var(--text-secondary);
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border-color);
            border-top-color: var(--color-brainly-green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script src="js/theme.js"></script>
    <script src="js/main.js" defer></script>
</head>
<body>

    <header id="header-placeholder"></header>

    <main class="blog-page-main">
        <div style="text-align: center; margin-bottom: 36px;">
            <h1 class="content-title">Blog & System Updates</h1>
            <p class="content-lead" style="max-width: 650px; margin: 12px auto 0 auto;">
                Latest announcements, development progress, and operational news from BrainlyHQ.
            </p>
        </div>

        <div class="blog-filter-bar">
            <button class="filter-btn active" data-filter="all">All Posts</button>
            <button class="filter-btn" data-filter="Announcements">Announcements</button>
            <button class="filter-btn" data-filter="Dev Updates">Dev Updates</button>
            <button class="filter-btn" data-filter="Guides">Guides</button>
            <button class="filter-btn" data-filter="General">General</button>
        </div>

        <div id="blog-grid" class="blog-grid">
            <div class="loading-wrapper">
                <div class="spinner"></div>
                <p>Fetching articles from repository...</p>
            </div>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>

    <script>
    const REPO_OWNER = "Ksperix";
    const REPO_NAME = "brainlyhq";
    let allPosts = [];

    async function fetchPosts() {
        const grid = document.getElementById("blog-grid");
        try {
            // Poprawny pełny adres API GitHuba
            const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/content/blog?t=${Date.now()}`;
            const res = await fetch(apiUrl);
            
            if (!res.ok) {
                throw new Error(`GitHub API returned status ${res.status}`);
            }

            const files = await res.json();
            const jsonFiles = files.filter(f => f.name && f.name.endsWith('.json'));

            if (jsonFiles.length === 0) {
                grid.innerHTML = `<p class="loading-wrapper">No articles published yet.</p>`;
                return;
            }

            // Pobieranie zawartości każdego posta z raw.githubusercontent.com
            allPosts = await Promise.all(jsonFiles.map(async file => {
                const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/content/blog/${file.name}?t=${Date.now()}`;
                const contentRes = await fetch(rawUrl);
                const data = await contentRes.json();
                return { ...data, slug: file.name.replace('.json', '') };
            }));

            // Sortowanie od najnowszych
            allPosts.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
            renderPosts(allPosts);

        } catch (err) {
            console.error("Blog Engine Error:", err);
            grid.innerHTML = `<p class="loading-wrapper">No articles found in this category.</p>`;
        }
    }

    function renderPosts(posts) {
        const grid = document.getElementById("blog-grid");
        if (!posts || posts.length === 0) {
            grid.innerHTML = `<p class="loading-wrapper">No articles found in this category.</p>`;
            return;
        }

        grid.innerHTML = posts.map(post => `
            <a href="post.html?slug=${post.slug}" class="blog-card">
                ${post.image ? `<img src="${post.image}" alt="${post.title || ''}" class="blog-card-cover">` : ''}
                <div class="blog-card-body">
                    <div class="blog-card-meta">
                        <span class="blog-card-tag">${post.category || 'General'}</span>
                        <span class="blog-card-date">${post.date ? new Date(post.date).toLocaleDateString() : ''}</span>
                    </div>
                    <h3 class="blog-card-title">${post.title || 'Untitled Post'}</h3>
                    <p class="blog-card-excerpt">${post.excerpt || ''}</p>
                </div>
            </a>
        `).join('');
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            
            const filter = e.target.getAttribute('data-filter');
            if (filter === 'all') {
                renderPosts(allPosts);
            } else {
                renderPosts(allPosts.filter(p => p.category === filter));
            }
        });
    });

    document.addEventListener("DOMContentLoaded", fetchPosts);
</script>
