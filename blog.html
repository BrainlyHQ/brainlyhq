<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog & Updates - BrainlyHQ</title>
    <link rel="icon" type="image/png" href="assets/BRAINLYHQ LOGO.png">
    <link rel="stylesheet" href="css/style.css">

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#99EE60">

    <style>
        .blog-page-main {
            margin-top: 40px;
            margin-bottom: 80px;
            max-width: 1140px;
            margin-left: auto;
            margin-right: auto;
            padding: 0 24px;
        }

        .blog-header-section {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .blog-header-section::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 100px;
            background: radial-gradient(circle, rgba(153, 238, 96, 0.12) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Wyszukiwarka i filtry */
        .blog-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 450px;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            font-family: var(--font-primary);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .search-input:focus {
            border-color: var(--color-brainly-green);
            box-shadow: 0 0 15px rgba(153, 238, 96, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-secondary);
        }

        .blog-filter-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 18px;
            border-radius: 20px;
            font-family: var(--font-primary);
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--color-brainly-green);
            color: #000000;
            border-color: var(--color-brainly-green);
            box-shadow: 0 4px 12px rgba(153, 238, 96, 0.25);
        }

        /* Wyróżniony wpis (Featured) */
        .featured-post-container {
            margin-bottom: 48px;
        }

        .featured-card {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .featured-card:hover {
            transform: translateY(-4px);
            border-color: var(--color-brainly-green);
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }

        .featured-cover {
            width: 100%;
            height: 100%;
            min-height: 280px;
            object-fit: cover;
            background-color: var(--bg-primary);
        }

        .featured-body {
            padding: 36px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .featured-badge {
            align-self: flex-start;
            background-color: var(--color-brainly-green);
            color: #000000;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .featured-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1.25;
            margin-bottom: 14px;
        }

        .featured-excerpt {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* Siatka tradycyjna */
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 28px;
        }

        .blog-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            text-decoration: none;
            color: inherit;
        }

        .blog-card:hover {
            transform: translateY(-5px);
            border-color: var(--color-brainly-green);
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        .blog-card-cover-wrap {
            width: 100%;
            height: 200px;
            overflow: hidden;
            background-color: var(--bg-primary);
            position: relative;
        }

        .blog-card-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .blog-card:hover .blog-card-cover {
            transform: scale(1.04);
        }

        .blog-card-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .blog-card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.78rem;
        }

        .blog-card-tag {
            background-color: rgba(153, 238, 96, 0.15);
            color: var(--color-brainly-green);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .blog-card-date {
            color: var(--text-secondary);
            font-family: monospace;
        }

        .blog-card-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 10px;
            line-height: 1.35;
        }

        .blog-card-excerpt {
            color: var(--text-secondary);
            font-size: 0.88rem;
            line-height: 1.5;
            flex: 1;
            margin-bottom: 18px;
        }

        .blog-card-footer {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--color-brainly-green);
        }

        .loading-wrapper {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 0;
            color: var(--text-secondary);
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border-color);
            border-top-color: var(--color-brainly-green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 868px) {
            .featured-card {
                grid-template-columns: 1fr;
            }
            .featured-cover {
                height: 220px;
            }
            .featured-body {
                padding: 24px;
            }
        }
    </style>

    <script src="js/theme.js"></script>
    <script src="js/main.js" defer></script>
</head>
<body>

    <header id="header-placeholder"></header>

    <main class="blog-page-main">
        <div class="blog-header-section">
            <h1 class="content-title">Blog & System Updates</h1>
            <p class="content-lead" style="max-width: 650px; margin: 10px auto 0 auto;">
                Latest announcements, development progress, and operational news from BrainlyHQ.
            </p>
        </div>

        <div class="blog-controls">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="blog-search-input" class="search-input" placeholder="Search articles by keywords...">
            </div>

            <div class="blog-filter-bar">
                <button class="filter-btn active" data-filter="all">All Posts</button>
                <button class="filter-btn" data-filter="Announcements">Announcements</button>
                <button class="filter-btn" data-filter="Dev Updates">Dev Updates</button>
                <button class="filter-btn" data-filter="Guides">Guides</button>
                <button class="filter-btn" data-filter="General">General</button>
            </div>
        </div>

        <!-- Sekcja wyróżnionego wpisu -->
        <div id="featured-post-container" class="featured-post-container"></div>

        <!-- Siatka wpisów -->
        <div id="blog-grid" class="blog-grid">
            <div class="loading-wrapper">
                <div class="spinner"></div>
                <p>Fetching articles from repository...</p>
            </div>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>

    <script>
        const REPO_OWNER = "Ksperix";
        const REPO_NAME = "brainlyhq";
        let allPosts = [];
        let activeFilter = 'all';

        async function fetchPosts() {
            const grid = document.getElementById("blog-grid");
            const featuredContainer = document.getElementById("featured-post-container");

            try {
                const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/content/blog?t=${Date.now()}`;
                const res = await fetch(apiUrl);
                
                if (res.status === 404) {
                    grid.innerHTML = `<p class="loading-wrapper">No articles published yet.</p>`;
                    return;
                }

                if (!res.ok) throw new Error(`GitHub API returned status ${res.status}`);

                const files = await res.json();
                const jsonFiles = files.filter(f => f.name && f.name.endsWith('.json'));

                if (jsonFiles.length === 0) {
                    grid.innerHTML = `<p class="loading-wrapper">No articles published yet.</p>`;
                    return;
                }

                allPosts = await Promise.all(jsonFiles.map(async file => {
                    const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/content/blog/${file.name}?t=${Date.now()}`;
                    const contentRes = await fetch(rawUrl);
                    const data = await contentRes.json();
                    return { ...data, slug: file.name.replace('.json', '') };
                }));

                allPosts.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
                applyFiltersAndRender();

            } catch (err) {
                console.error("Blog Engine Error:", err);
                grid.innerHTML = `<p class="loading-wrapper">Unable to load blog articles.</p>`;
            }
        }

        function applyFiltersAndRender() {
            const searchQuery = document.getElementById("blog-search-input").value.toLowerCase().trim();
            const featuredContainer = document.getElementById("featured-post-container");
            const grid = document.getElementById("blog-grid");

            let filtered = allPosts.filter(post => {
                const matchesFilter = activeFilter === 'all' || post.category === activeFilter;
                const matchesSearch = !searchQuery || 
                    (post.title && post.title.toLowerCase().includes(searchQuery)) ||
                    (post.excerpt && post.excerpt.toLowerCase().includes(searchQuery)) ||
                    (post.body && post.body.toLowerCase().includes(searchQuery));
                
                return matchesFilter && matchesSearch;
            });

            if (filtered.length === 0) {
                featuredContainer.innerHTML = '';
                grid.innerHTML = `<p class="loading-wrapper">No articles found matching your criteria.</p>`;
                return;
            }

            // Jeśli nie ma aktywnej frazy szukania i jestemy w "All Posts", wyciągamy pierwszy wpis jako Featured
            if (!searchQuery && activeFilter === 'all' && filtered.length > 0) {
                const featuredPost = filtered[0];
                const gridPosts = filtered.slice(1);

                featuredContainer.innerHTML = `
                    <a href="post.html?slug=${featuredPost.slug}" class="featured-card">
                        ${featuredPost.image ? `<img src="${featuredPost.image}" alt="${featuredPost.title}" class="featured-cover">` : '<div class="featured-cover"></div>'}
                        <div class="featured-body">
                            <span class="featured-badge">FEATURED ${featuredPost.category ? `• ${featuredPost.category}` : ''}</span>
                            <h2 class="featured-title">${featuredPost.title || 'Untitled'}</h2>
                            <p class="featured-excerpt">${featuredPost.excerpt || ''}</p>
                            <div class="blog-card-footer">
                                <span>Read Full Article</span> &#8594;
                            </div>
                        </div>
                    </a>
                `;

                renderGrid(gridPosts);
            } else {
                featuredContainer.innerHTML = '';
                renderGrid(filtered);
            }
        }

        function renderGrid(posts) {
            const grid = document.getElementById("blog-grid");
            if (posts.length === 0) {
                grid.innerHTML = `<p class="loading-wrapper" style="grid-column: 1/-1;">No more articles in this section.</p>`;
                return;
            }

            grid.innerHTML = posts.map(post => `
                <a href="post.html?slug=${post.slug}" class="blog-card">
                    <div class="blog-card-cover-wrap">
                        ${post.image ? `<img src="${post.image}" alt="${post.title || ''}" class="blog-card-cover">` : ''}
                    </div>
                    <div class="blog-card-body">
                        <div class="blog-card-meta">
                            <span class="blog-card-tag">${post.category || 'General'}</span>
                            <span class="blog-card-date">${post.date ? new Date(post.date).toLocaleDateString() : ''}</span>
                        </div>
                        <h3 class="blog-card-title">${post.title || 'Untitled Post'}</h3>
                        <p class="blog-card-excerpt">${post.excerpt || ''}</p>
                        <div class="blog-card-footer">
                            <span>Read Article</span> &#8594;
                        </div>
                    </div>
                </a>
            `).join('');
        }

        // Filtrowanie kategorii
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                activeFilter = e.target.getAttribute('data-filter');
                applyFiltersAndRender();
            });
        });

        // Wyszukiwanie w czasie rzeczywistym
        document.getElementById("blog-search-input").addEventListener("input", applyFiltersAndRender);

        document.addEventListener("DOMContentLoaded", fetchPosts);
    </script>
</body>
</html>
