<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog & Updates - BrainlyHQ</title>
    <link rel="icon" type="image/png" href="assets/BRAINLYHQ LOGO.png">
    <link rel="stylesheet" href="css/style.css">

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#99EE60">

    <style>
        .blog-page-main {
            margin-top: 40px;
            margin-bottom: 80px;
            max-width: 1140px;
            margin-left: auto;
            margin-right: auto;
            padding: 0 24px;
        }

        .blog-header-section {
            text-align: center;
            margin-bottom: 32px;
        }

        /* Wyszukiwarka i filtry */
        .blog-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 40px;
            width: fit-content;
            max-width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 12px 18px 12px 42px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            font-family: var(--font-primary);
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            box-sizing: border-box;
        }

        .search-input:focus {
            border-color: var(--color-brainly-green);
            box-shadow: 0 0 10px rgba(153, 238, 96, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-secondary);
        }

        .blog-filter-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
        }

        .filter-btn {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: var(--font-primary);
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--color-brainly-green);
            color: #000000;
            border-color: var(--color-brainly-green);
        }

        /* Jednolita siatka artykułów */
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .blog-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            color: inherit;
        }

        .blog-card:hover {
            transform: translateY(-4px);
            border-color: var(--color-brainly-green);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .blog-card-cover-wrap {
            width: 100%;
            height: 190px;
            overflow: hidden;
            background-color: var(--bg-primary);
        }

        .blog-card-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .blog-card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .blog-card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.78rem;
        }

        .blog-card-tag {
            background-color: rgba(153, 238, 96, 0.15);
            color: var(--color-brainly-green);
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .blog-card-info-top {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-family: var(--font-primary);
        }

        .blog-card-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.35;
        }

        .blog-card-excerpt {
            color: var(--text-secondary);
            font-size: 0.88rem;
            line-height: 1.5;
            flex: 1;
            margin-bottom: 16px;
        }

        .blog-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--color-brainly-green);
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 12px;
        }

        .blog-card-author {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.78rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .loading-wrapper {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 0;
            color: var(--text-secondary);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-color);
            border-top-color: var(--color-brainly-green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script src="js/theme.js"></script>
    <script src="js/main.js" defer></script>
</head>
<body>

    <header id="header-placeholder"></header>

    <main class="blog-page-main">
        <div class="blog-header-section">
            <h1 class="content-title">Blog & System Updates</h1>
            <p class="content-lead" style="max-width: 600px; margin: 8px auto 0 auto;">
                Latest announcements, development progress, and operational news from BrainlyHQ.
            </p>
        </div>

        <div class="blog-controls">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="blog-search-input" class="search-input" placeholder="Search articles by keywords...">
            </div>

            <div class="blog-filter-bar">
                <button class="filter-btn active" data-filter="all">All Posts</button>
                <button class="filter-btn" data-filter="Announcements">Announcements</button>
                <button class="filter-btn" data-filter="Dev Updates">Dev Updates</button>
                <button class="filter-btn" data-filter="Guides">Guides</button>
                <button class="filter-btn" data-filter="General">General</button>
            </div>
        </div>

        <!-- Siatka wszystkich wpisów -->
        <div id="blog-grid" class="blog-grid">
            <div class="loading-wrapper">
                <div class="spinner"></div>
                <p>Fetching articles from repository...</p>
            </div>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>

    <script>
        const REPO_OWNER = "Ksperix";
        const REPO_NAME = "brainlyhq";
        let allPosts = [];
        let activeFilter = 'all';

        function calculateReadTime(text) {
            if (!text) return '1 min read';
            const wordsPerMinute = 90; // Dostosowane do realistycznego czytania długich publikacji
            const words = text.trim().split(/\s+/).length;
            const minutes = Math.ceil(words / wordsPerMinute);
            return `${minutes} min read`;
        }

        async function fetchPosts() {
            const grid = document.getElementById("blog-grid");

            try {
                const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/content/blog?t=${Date.now()}`;
                const res = await fetch(apiUrl);
                
                if (res.status === 404) {
                    grid.innerHTML = `<p class="loading-wrapper">No articles published yet.</p>`;
                    return;
                }

                if (!res.ok) throw new Error(`GitHub API returned status ${res.status}`);

                const files = await res.json();
                const jsonFiles = files.filter(f => f.name && f.name.endsWith('.json'));

                if (jsonFiles.length === 0) {
                    grid.innerHTML = `<p class="loading-wrapper">No articles published yet.</p>`;
                    return;
                }

                allPosts = await Promise.all(jsonFiles.map(async file => {
                    const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/content/blog/${file.name}?t=${Date.now()}`;
                    const contentRes = await fetch(rawUrl);
                    const data = await contentRes.json();
                    return { ...data, slug: file.name.replace('.json', '') };
                }));

                allPosts.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
                applyFiltersAndRender();

            } catch (err) {
                console.error("Blog Engine Error:", err);
                grid.innerHTML = `<p class="loading-wrapper">Unable to load blog articles.</p>`;
            }
        }

        function applyFiltersAndRender() {
            const searchQuery = document.getElementById("blog-search-input").value.toLowerCase().trim();

            let filtered = allPosts.filter(post => {
                const matchesFilter = activeFilter === 'all' || post.category === activeFilter;
                const matchesSearch = !searchQuery || 
                    (post.title && post.title.toLowerCase().includes(searchQuery)) ||
                    (post.excerpt && post.excerpt.toLowerCase().includes(searchQuery)) ||
                    (post.body && post.body.toLowerCase().includes(searchQuery));
                
                return matchesFilter && matchesSearch;
            });

            renderGrid(filtered);
        }

        function renderGrid(posts) {
            const grid = document.getElementById("blog-grid");
            if (!posts || posts.length === 0) {
                grid.innerHTML = `<p class="loading-wrapper">No articles found matching your criteria.</p>`;
                return;
            }

            grid.innerHTML = posts.map(post => `
                <a href="post.html?slug=${post.slug}" class="blog-card">
                    ${post.image ? `
                        <div class="blog-card-cover-wrap">
                            <img src="${post.image}" alt="${post.title || ''}" class="blog-card-cover">
                        </div>
                    ` : ''}
                    <div class="blog-card-body">
                        <div class="blog-card-meta">
                            <span class="blog-card-tag">${post.category || 'General'}</span>
                            <div class="blog-card-info-top">
                                <span>${calculateReadTime(post.body)}</span>
                                <span>•</span>
                                <span>${post.date ? new Date(post.date).toLocaleDateString() : ''}</span>
                            </div>
                        </div>
                        <h3 class="blog-card-title">${post.title || 'Untitled Post'}</h3>
                        <p class="blog-card-excerpt">${post.excerpt || ''}</p>
                        <div class="blog-card-footer">
                            <span class="blog-card-author">By ${post.author || 'BrainlyHQ Team'}</span>
                            <span>Read Article &#8594;</span>
                        </div>
                    </div>
                </a>
            `).join('');
        }

        // Filtrowanie kategorii
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                activeFilter = e.target.getAttribute('data-filter');
                applyFiltersAndRender();
            });
        });

        // Wyszukiwanie w czasie rzeczywistym
        document.getElementById("blog-search-input").addEventListener("input", applyFiltersAndRender);

        document.addEventListener("DOMContentLoaded", fetchPosts);
    </script>
</body>
</html>
