backend:
  name: github
  repo: Ksperix/brainlyhq
  branch: main
  base_url: https://sveltia-cms-auth.vercel.app

media_folder: "assets/images/blog"
public_folder: "assets/images/blog"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "json"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Category", name: "category", widget: "select", options: ["Announcements", "Dev Updates", "Guides", "General"] }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Short Excerpt", name: "excerpt", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }
