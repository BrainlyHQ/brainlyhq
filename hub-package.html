<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainlyHub - Package Details</title>

    <script>
        (function() {
            const sessionUser = sessionStorage.getItem("brainly_hub_user");
            if (!sessionUser) {
                window.location.replace("hub.html");
            }
        })();
    </script>

    <link rel="icon" type="image/png" href="assets/Brainly Hub.png">
    <link rel="stylesheet" href="css/style.css">

    <style>
        #header-placeholder, #footer-placeholder {
            display: none !important;
        }

        :root {
            --neon-glow-primary: rgba(153, 238, 96, 0.22);
            --grid-line-color: rgba(255, 255, 255, 0.025);
        }

        [data-theme="light"] {
            --grid-line-color: rgba(0, 0, 0, 0.025);
            --neon-glow-primary: rgba(153, 238, 96, 0.35);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-primary, sans-serif);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(var(--grid-line-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line-color) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-glow-top {
            position: fixed; top: -200px; left: 50%;
            transform: translateX(-50%);
            width: 850px; height: 450px;
            background: radial-gradient(circle, var(--color-brainly-green) 0%, transparent 70%);
            opacity: 0.16; filter: blur(100px);
            pointer-events: none; z-index: 0;
        }

        .hub-navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 32px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(12px);
        }

        .hub-brand {
            display: flex; align-items: center; gap: 12px;
            text-decoration: none;
        }

        .hub-brand img { height: 32px; width: auto; }

        .hub-brand-title {
            font-size: 1.1rem; font-weight: 900;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .btn-back-hub {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-primary); text-decoration: none;
            padding: 8px 16px; border-radius: 8px;
            font-size: 0.82rem; font-weight: 700;
            transition: all 0.2s ease;
        }

        .btn-back-hub:hover {
            background: var(--bg-primary);
            border-color: var(--color-brainly-green);
        }

        .package-details-container {
            max-width: 850px; margin: 40px auto;
            padding: 0 24px 80px 24px;
            width: 100%; box-sizing: border-box;
            position: relative; z-index: 1;
        }

        .package-header-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px; padding: 32px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
        }

        .package-header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }

        .package-header-title {
            font-size: 1.8rem; font-weight: 900;
            color: var(--text-primary); margin: 16px 0 8px 0;
            line-height: 1.3;
        }

        .package-actions {
            display: flex; gap: 10px; align-items: center;
        }

        .btn-action-icon {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 42px; height: 42px;
            border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s ease;
            padding: 0;
        }

        .btn-action-icon:hover {
            border-color: var(--color-brainly-green);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .btn-action-icon.active-fav {
            color: #ff4a4a;
            border-color: rgba(255, 74, 74, 0.4);
            background: rgba(255, 74, 74, 0.1);
        }

        .package-badges { display: flex; flex-wrap: wrap; gap: 8px; }

        .badge {
            font-size: 0.72rem; font-weight: 800; padding: 4px 10px;
            border-radius: 6px; text-transform: uppercase; letter-spacing: 0.4px;
        }

        .badge-market { background: rgba(153, 238, 96, 0.15); color: var(--color-brainly-green); }
        .badge-level { background: rgba(255, 255, 255, 0.08); color: var(--text-primary); }
        .badge-subject { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .badge-exam { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }

        /* Learning Path Progress Bar */
        .learning-progress-box {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .progress-info {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.85rem; font-weight: 700; color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            width: 100%; height: 10px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px; overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%; width: 0%;
            background: var(--color-brainly-green);
            transition: width 0.3s ease;
            box-shadow: 0 0 12px var(--neon-glow-primary);
        }

        .tasks-list-section {
            display: flex; flex-direction: column; gap: 14px;
        }

        .task-item-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px; padding: 18px 24px;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s ease; gap: 16px;
        }

        .task-item-card:hover {
            border-color: rgba(153, 238, 96, 0.5);
            transform: translateX(4px);
        }

        .task-item-card.completed-task {
            opacity: 0.6;
            background: rgba(255, 255, 255, 0.015);
        }

        .task-item-left {
            display: flex; align-items: center; gap: 14px;
        }

        /* CUSTOM ROUND CHECKBOX */
        .custom-chk-container {
            display: inline-flex;
            align-items: center;
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .custom-chk-container input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0; width: 0;
        }

        .checkmark-circle {
            height: 22px; width: 22px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            flex-shrink: 0;
        }

        .custom-chk-container:hover input ~ .checkmark-circle {
            border-color: var(--color-brainly-green);
        }

        .custom-chk-container input:checked ~ .checkmark-circle {
            background-color: var(--color-brainly-green);
            border-color: var(--color-brainly-green);
            box-shadow: 0 0 10px var(--neon-glow-primary);
        }

        .checkmark-icon {
            display: none;
            width: 12px; height: 12px;
            color: #000000;
        }

        .custom-chk-container input:checked ~ .checkmark-circle .checkmark-icon {
            display: block;
        }

        .task-item-title {
            font-size: 1.05rem; font-weight: 800; color: var(--text-primary);
            letter-spacing: -0.2px; transition: color 0.2s ease;
        }

        .task-item-card.completed-task .task-item-title {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .btn-task-link {
            display: inline-flex; align-items: center; gap: 8px;
            background-color: var(--color-brainly-green);
            color: #000000; text-decoration: none;
            font-weight: 800; font-size: 0.84rem;
            padding: 9px 18px; border-radius: 8px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .btn-task-link:hover { opacity: 0.9; transform: scale(0.98); }

        .toast-notification {
            position: fixed; bottom: 30px; right: 30px;
            background: var(--bg-secondary); color: var(--text-primary);
            border: 1px solid var(--color-brainly-green);
            padding: 12px 20px; border-radius: 10px; font-weight: 700;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transform: translateY(100px); opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
        }

        .toast-notification.show {
            transform: translateY(0); opacity: 1;
        }
    </style>

    <script src="js/theme.js"></script>
    <script src="js/hub-render.js"></script>
</head>
<body>

    <div class="ambient-glow-top"></div>

    <header class="hub-navbar">
        <a href="brainlyhub.html" class="hub-brand">
            <img src="assets/Brainly Hub.png" alt="BrainlyHub Logo">
            <span class="hub-brand-title">BrainlyHub</span>
        </a>

        <a href="brainlyhub.html" class="btn-back-hub">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
            <span>Back to Search</span>
        </a>
    </header>

    <main class="package-details-container">
        <div id="package-header-target" class="package-header-card">
            <p style="color: var(--text-secondary);">Loading package info...</p>
        </div>

        <h3 style="font-size: 1.1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 16px; color: var(--text-secondary);">
            Learning Path & Tasks
        </h3>

        <div id="tasks-list-target" class="tasks-list-section"></div>
    </main>

    <div id="toast" class="toast-notification">Link copied to clipboard!</div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz8b4O-3LXd4ZVbQb3YDoueoaK-wzJvOBUlDG6BqT1IOloyFrhMLClg-5tqDcWWyHPu/exec";
        let currentPackageObj = null;

        function fetchFreshDbJSONP() {
            return new Promise((resolve, reject) => {
                const cbName = 'jsonp_pkg_db_' + Math.round(100000 * Math.random());
                const script = document.createElement('script');
                window[cbName] = function(data) {
                    delete window[cbName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                    resolve(data);
                };
                script.onerror = function() {
                    delete window[cbName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                    reject(new Error("JSONP failed"));
                };
                script.src = `${API_URL}?callback=${cbName}&_t=${Date.now()}`;
                document.body.appendChild(script);
            });
        }

        // --- FAVORITES LOGIC ---
        function getFavorites() {
            try {
                return JSON.parse(localStorage.getItem("brainly_favorites")) || [];
            } catch(e) { return []; }
        }

        function isFavorite(topic, market) {
            const favs = getFavorites();
            return favs.some(f => f.topic.toLowerCase() === topic.toLowerCase() && f.market.toUpperCase() === market.toUpperCase());
        }

        function toggleFavorite(topic, market) {
            let favs = getFavorites();
            if (isFavorite(topic, market)) {
                favs = favs.filter(f => !(f.topic.toLowerCase() === topic.toLowerCase() && f.market.toUpperCase() === market.toUpperCase()));
                showToast("Removed from favorites");
            } else {
                favs.push({ topic, market, addedAt: Date.now() });
                showToast("Added to favorites"); // Usunięto serduszko z powiadomienia
            }
            localStorage.setItem("brainly_favorites", JSON.stringify(favs));
            updateFavButtonUI(topic, market);
        }

        function updateFavButtonUI(topic, market) {
            const btn = document.getElementById("btn-fav-toggle");
            if (!btn) return;
            const active = isFavorite(topic, market);
            btn.classList.toggle("active-fav", active);
            btn.innerHTML = active 
                ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`
                : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
        }

        // --- LEARNING PATH PROGRESS LOGIC ---
        function getProgress() {
            try {
                return JSON.parse(localStorage.getItem("brainly_learning_progress")) || {};
            } catch(e) { return {}; }
        }

        function toggleTaskCompletion(packageKey, taskUrl) {
            const prog = getProgress();
            if (!prog[packageKey]) prog[packageKey] = [];
            
            const idx = prog[packageKey].indexOf(taskUrl);
            if (idx > -1) {
                prog[packageKey].splice(idx, 1);
            } else {
                prog[packageKey].push(taskUrl);
            }
            
            localStorage.setItem("brainly_learning_progress", JSON.stringify(prog));
            renderProgressUI(packageKey);
        }

        function renderProgressUI(packageKey) {
            if (!currentPackageObj) return;
            const prog = getProgress();
            const completedUrls = prog[packageKey] || [];
            const totalTasks = currentPackageObj.structuredLinks.length;
            const completedCount = currentPackageObj.structuredLinks.filter(l => completedUrls.includes(l.url)).length;
            const percentage = totalTasks > 0 ? Math.round((completedCount / totalTasks) * 100) : 0;

            const countEl = document.getElementById("progress-count-text");
            const fillEl = document.getElementById("progress-bar-fill");
            if (countEl) countEl.textContent = `${completedCount} / ${totalTasks} completed (${percentage}%)`;
            if (fillEl) fillEl.style.width = `${percentage}%`;

            currentPackageObj.structuredLinks.forEach((linkObj, idx) => {
                const card = document.getElementById(`task-card-${idx}`);
                const chk = document.getElementById(`task-chk-${idx}`);
                const isDone = completedUrls.includes(linkObj.url);
                if (card) card.classList.toggle("completed-task", isDone);
                if (chk) chk.checked = isDone;
            });
        }

        // --- SHARE LOGIC ---
        function sharePackage() {
            const shareData = {
                title: document.title,
                text: `Check out this learning package on BrainlyHub!`,
                url: window.location.href
            };
            if (navigator.share) {
                navigator.share(shareData).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                showToast("Link copied to clipboard!");
            }
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.textContent = msg;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 2500);
        }

        function renderUIFromData(rawDatabase, topicParam, marketParam) {
            const headerTarget = document.getElementById("package-header-target");
            const tasksTarget = document.getElementById("tasks-list-target");

            const grouped = groupDatabaseIntoPackages(rawDatabase);
            const foundPackage = grouped.find(p => 
                p.displayTopic.trim().toLowerCase() === topicParam.trim().toLowerCase() &&
                (!marketParam || p.marketKey.toUpperCase() === marketParam.toUpperCase())
            );

            if (!foundPackage) {
                headerTarget.innerHTML = `<p>Package details not found. <a href="brainlyhub.html" style="color: var(--color-brainly-green);">Return to search</a></p>`;
                return false;
            }

            currentPackageObj = foundPackage;
            const packageKey = `${foundPackage.displayTopic.toLowerCase()}____${foundPackage.marketKey.toUpperCase()}`;

            // Render Header
            const isExam = Array.from(foundPackage.subjects).some(s => s.toLowerCase() === 'exam') || foundPackage.levels.has('EXAM');
            const marketLabel = (typeof MARKET_MAP !== 'undefined' && MARKET_MAP[foundPackage.marketKey]) || foundPackage.marketKey;
            let badgesHtml = `<span class="badge badge-market">${escapeHtml(marketLabel)}</span>`;

            if (isExam) {
                badgesHtml += `<span class="badge badge-exam">EXAM RESOURCE</span>`;
            } else {
                foundPackage.levels.forEach(l => {
                    const lLabel = (typeof LEVEL_MAP !== 'undefined' && LEVEL_MAP[l]) || l;
                    badgesHtml += `<span class="badge badge-level">${escapeHtml(lLabel)}</span>`;
                });
            }

            foundPackage.subjects.forEach(s => {
                badgesHtml += `<span class="badge badge-subject">${escapeHtml(s)}</span>`;
            });

            headerTarget.innerHTML = `
                <div class="package-header-top">
                    <div>
                        <div class="package-badges">${badgesHtml}</div>
                        <h1 class="package-header-title">${escapeHtml(foundPackage.displayTopic)}</h1>
                        <p style="margin: 0; font-size: 0.88rem; color: var(--text-secondary);">Total resources: <strong style="color: var(--color-brainly-green);">${foundPackage.structuredLinks.length}</strong></p>
                    </div>
                    <div class="package-actions">
                        <button id="btn-fav-toggle" class="btn-action-icon" title="Toggle Favorite" onclick="toggleFavorite('${escapeHtml(foundPackage.displayTopic)}', '${escapeHtml(foundPackage.marketKey)}')">
                        </button>
                        <button class="btn-action-icon" title="Share Package" onclick="sharePackage()">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
                        </button>
                    </div>
                </div>

                <div class="learning-progress-box">
                    <div class="progress-info">
                        <span>Learning Path Progress</span>
                        <span id="progress-count-text">0 / 0 completed (0%)</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="progress-bar-fill" class="progress-bar-fill"></div>
                    </div>
                </div>
            `;

            updateFavButtonUI(foundPackage.displayTopic, foundPackage.marketKey);

            // Render Task Items
            tasksTarget.innerHTML = "";
            foundPackage.structuredLinks.forEach((linkObj, idx) => {
                const itemDiv = document.createElement("div");
                itemDiv.className = "task-item-card";
                itemDiv.id = `task-card-${idx}`;

                const finalTaskTitle = (linkObj.title && !linkObj.title.startsWith("Task #")) 
                    ? linkObj.title 
                    : (linkObj.category || `Task ${idx + 1}.`);

                itemDiv.innerHTML = `
                    <div class="task-item-left">
                        <label class="custom-chk-container">
                            <input type="checkbox" id="task-chk-${idx}" onchange="toggleTaskCompletion('${escapeHtml(packageKey)}', '${escapeHtml(linkObj.url)}')">
                            <span class="checkmark-circle">
                                <svg class="checkmark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </span>
                        </label>
                        <span class="task-item-title">${escapeHtml(finalTaskTitle)}</span>
                    </div>
                    <a href="${escapeHtml(linkObj.url)}" target="_blank" rel="noopener noreferrer" class="btn-task-link">
                        <span>Solve Task</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                    </a>
                `;
                tasksTarget.appendChild(itemDiv);
            });

            renderProgressUI(packageKey);
            return true;
        }

        async function initPackageView() {
            const urlParams = new URLSearchParams(window.location.search);
            const topicParam = urlParams.get("topic");
            const marketParam = urlParams.get("market");

            const headerTarget = document.getElementById("package-header-target");

            if (!topicParam) {
                headerTarget.innerHTML = `<p>Package not found. <a href="brainlyhub.html" style="color: var(--color-brainly-green);">Return to search</a></p>`;
                return;
            }

            const cachedData = localStorage.getItem("brainly_db_cache");
            if (cachedData) {
                try {
                    const parsed = JSON.parse(cachedData);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        renderUIFromData(parsed, topicParam, marketParam);
                    }
                } catch(e) {}
            }

            try {
                const response = await fetchFreshDbJSONP();
                if (response && response.success && Array.isArray(response.data)) {
                    localStorage.setItem("brainly_db_cache", JSON.stringify(response.data));
                    renderUIFromData(response.data, topicParam, marketParam);
                }
            } catch(e) {
                console.warn("Live fetch error, cache was used:", e);
            }
        }

        document.addEventListener("DOMContentLoaded", initPackageView);
    </script>
</body>
</html>
