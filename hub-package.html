<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainlyHub - Package Details</title>

    <script>
        (function() {
            const sessionUser = sessionStorage.getItem("brainly_hub_user");
            if (!sessionUser) {
                window.location.replace("hub.html");
            }
        })();
    </script>

    <link rel="icon" type="image/png" href="assets/Brainly Hub.png">
    <link rel="stylesheet" href="css/style.css">

    <style>
        #header-placeholder, #footer-placeholder {
            display: none !important;
        }

        :root {
            --neon-glow-primary: rgba(153, 238, 96, 0.22);
            --grid-line-color: rgba(255, 255, 255, 0.025);
        }

        [data-theme="light"] {
            --grid-line-color: rgba(0, 0, 0, 0.025);
            --neon-glow-primary: rgba(153, 238, 96, 0.35);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-primary, sans-serif);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(var(--grid-line-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line-color) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-glow-top {
            position: fixed; top: -200px; left: 50%;
            transform: translateX(-50%);
            width: 850px; height: 450px;
            background: radial-gradient(circle, var(--color-brainly-green) 0%, transparent 70%);
            opacity: 0.16; filter: blur(100px);
            pointer-events: none; z-index: 0;
        }

        .hub-navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 32px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(12px);
        }

        .hub-brand {
            display: flex; align-items: center; gap: 12px;
            text-decoration: none;
        }

        .hub-brand img { height: 32px; width: auto; }

        .hub-brand-title {
            font-size: 1.1rem; font-weight: 900;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .btn-back-hub {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-primary); text-decoration: none;
            padding: 8px 16px; border-radius: 8px;
            font-size: 0.82rem; font-weight: 700;
            transition: all 0.2s ease;
        }

        .btn-back-hub:hover {
            background: var(--bg-primary);
            border-color: var(--color-brainly-green);
        }

        .package-details-container {
            max-width: 850px; margin: 40px auto;
            padding: 0 24px 80px 24px;
            width: 100%; box-sizing: border-box;
            position: relative; z-index: 1;
        }

        .package-header-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px; padding: 32px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .package-header-title {
            font-size: 1.8rem; font-weight: 900;
            color: var(--text-primary); margin: 16px 0 8px 0;
            line-height: 1.3;
        }

        .package-badges { display: flex; flex-wrap: wrap; gap: 8px; }

        .badge {
            font-size: 0.72rem; font-weight: 800; padding: 4px 10px;
            border-radius: 6px; text-transform: uppercase; letter-spacing: 0.4px;
        }

        .badge-market { background: rgba(153, 238, 96, 0.15); color: var(--color-brainly-green); }
        .badge-level { background: rgba(255, 255, 255, 0.08); color: var(--text-primary); }
        .badge-subject { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .badge-exam { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }

        .tasks-list-section {
            display: flex; flex-direction: column; gap: 14px;
        }

        .task-item-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px; padding: 18px 24px;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s ease;
            gap: 16px;
        }

        .task-item-card:hover {
            border-color: rgba(153, 238, 96, 0.5);
            transform: translateX(4px);
        }

        .task-item-title {
            font-size: 1.05rem; font-weight: 800; color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .btn-task-link {
            display: inline-flex; align-items: center; gap: 8px;
            background-color: var(--color-brainly-green);
            color: #000000; text-decoration: none;
            font-weight: 800; font-size: 0.84rem;
            padding: 9px 18px; border-radius: 8px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .btn-task-link:hover { opacity: 0.9; transform: scale(0.98); }
    </style>

    <script src="js/theme.js"></script>
    <script src="js/hub-render.js"></script>
</head>
<body>

    <div class="ambient-glow-top"></div>

    <header class="hub-navbar">
        <a href="brainlyhub.html" class="hub-brand">
            <img src="assets/Brainly Hub.png" alt="BrainlyHub Logo">
            <span class="hub-brand-title">BrainlyHub</span>
        </a>

        <a href="brainlyhub.html" class="btn-back-hub">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
            <span>Back to Search</span>
        </a>
    </header>

    <main class="package-details-container">
        <div id="package-header-target" class="package-header-card">
            <p style="color: var(--text-secondary);">Loading package info...</p>
        </div>

        <h3 style="font-size: 1.1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 16px; color: var(--text-secondary);">
            Tasks in this package
        </h3>

        <div id="tasks-list-target" class="tasks-list-section"></div>
    </main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz8b4O-3LXd4ZVbQb3YDoueoaK-wzJvOBUlDG6BqT1IOloyFrhMLClg-5tqDcWWyHPu/exec";

        function fetchFreshDbJSONP() {
            return new Promise((resolve, reject) => {
                const cbName = 'jsonp_pkg_db_' + Math.round(100000 * Math.random());
                const script = document.createElement('script');
                window[cbName] = function(data) {
                    delete window[cbName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                    resolve(data);
                };
                script.onerror = function() {
                    delete window[cbName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                    reject(new Error("JSONP failed"));
                };
                script.src = `${API_URL}?callback=${cbName}&_t=${Date.now()}`;
                document.body.appendChild(script);
            });
        }

        function renderUIFromData(rawDatabase, topicParam, marketParam) {
            const headerTarget = document.getElementById("package-header-target");
            const tasksTarget = document.getElementById("tasks-list-target");

            const grouped = groupDatabaseIntoPackages(rawDatabase);
            const foundPackage = grouped.find(p => 
                p.displayTopic.trim().toLowerCase() === topicParam.trim().toLowerCase() &&
                (!marketParam || p.marketKey.toUpperCase() === marketParam.toUpperCase())
            );

            if (!foundPackage) {
                headerTarget.innerHTML = `<p>Package details not found. <a href="brainlyhub.html" style="color: var(--color-brainly-green);">Return to search</a></p>`;
                return false;
            }

            // Renderowanie nagłówka
            const isExam = Array.from(foundPackage.subjects).some(s => s.toLowerCase() === 'exam') || foundPackage.levels.has('EXAM');
            const marketLabel = (typeof MARKET_MAP !== 'undefined' && MARKET_MAP[foundPackage.marketKey]) || foundPackage.marketKey;
            let badgesHtml = `<span class="badge badge-market">${escapeHtml(marketLabel)}</span>`;

            if (isExam) {
                badgesHtml += `<span class="badge badge-exam">EXAM RESOURCE</span>`;
            } else {
                foundPackage.levels.forEach(l => {
                    const lLabel = (typeof LEVEL_MAP !== 'undefined' && LEVEL_MAP[l]) || l;
                    badgesHtml += `<span class="badge badge-level">${escapeHtml(lLabel)}</span>`;
                });
            }

            foundPackage.subjects.forEach(s => {
                badgesHtml += `<span class="badge badge-subject">${escapeHtml(s)}</span>`;
            });

            headerTarget.innerHTML = `
                <div class="package-badges">${badgesHtml}</div>
                <h1 class="package-header-title">${escapeHtml(foundPackage.displayTopic)}</h1>
                <p style="margin: 0; font-size: 0.88rem; color: var(--text-secondary);">Total resources: <strong style="color: var(--color-brainly-green);">${foundPackage.structuredLinks.length}</strong></p>
            `;

            // Renderowanie listy zadań ze stabilnym odczytem wartości z kolumny F
            tasksTarget.innerHTML = "";
            foundPackage.structuredLinks.forEach((linkObj, idx) => {
                const itemDiv = document.createElement("div");
                itemDiv.className = "task-item-card";
                
                const finalTaskTitle = (linkObj.title && !linkObj.title.startsWith("Task #")) 
                    ? linkObj.title 
                    : (linkObj.category || `Zadanie ${idx + 1}.`);

                itemDiv.innerHTML = `
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <span class="task-item-title">${escapeHtml(finalTaskTitle)}</span>
                    </div>
                    <a href="${escapeHtml(linkObj.url)}" target="_blank" rel="noopener noreferrer" class="btn-task-link">
                        <span>Solve Task</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                    </a>
                `;
                tasksTarget.appendChild(itemDiv);
            });

            return true;
        }

        async function initPackageView() {
            const urlParams = new URLSearchParams(window.location.search);
            const topicParam = urlParams.get("topic");
            const marketParam = urlParams.get("market");

            const headerTarget = document.getElementById("package-header-target");

            if (!topicParam) {
                headerTarget.innerHTML = `<p>Package not found. <a href="brainlyhub.html" style="color: var(--color-brainly-green);">Return to search</a></p>`;
                return;
            }

            // 1. Ładowanie z pamięci podręcznej (Cache)
            const cachedData = localStorage.getItem("brainly_db_cache");
            if (cachedData) {
                try {
                    const parsed = JSON.parse(cachedData);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        renderUIFromData(parsed, topicParam, marketParam);
                    }
                } catch(e) {}
            }

            // 2. Ładowanie świeżych danych z API
            try {
                const response = await fetchFreshDbJSONP();
                if (response && response.success && Array.isArray(response.data)) {
                    localStorage.setItem("brainly_db_cache", JSON.stringify(response.data));
                    renderUIFromData(response.data, topicParam, marketParam);
                }
            } catch(e) {
                console.warn("Live fetch error, cache was used:", e);
            }
        }

        document.addEventListener("DOMContentLoaded", initPackageView);
    </script>
</body>
</html>
