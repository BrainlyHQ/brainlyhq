<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | BrainlyHQ</title>
    <link rel="icon" type="image/png" href="assets/BRAINLYHQ LOGO.png">
    <link rel="stylesheet" href="css/style.css">

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#99EE60">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="assets/icon-192.png">

    <style>
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-primary, sans-serif);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Canvas z animacją konstelacji w tle */
        #constellation-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.65;
            z-index: 0;
        }

        /* Tło w siatkę (Grid) */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        /* Sekcja główna z wymuszeniem wyśrodkowania */
        .error-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 24px;
            position: relative;
            z-index: 1;
            box-sizing: border-box;
        }

        /* Poświata zielona */
        .glow-404 {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--color-brainly-green, #99ee60) 0%, transparent 70%);
            opacity: 0.12;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
        }

        .error-container {
            position: relative;
            z-index: 2;
            max-width: 620px;
            text-align: center;
        }

        .error-code {
            font-size: 8.5rem;
            font-weight: 900;
            line-height: 1;
            margin: 0;
            color: var(--color-brainly-green, #99ee60);
            text-shadow: 0 0 35px rgba(153, 238, 96, 0.25);
            letter-spacing: -4px;
        }

        .error-title {
            font-size: 1.85rem;
            font-weight: 800;
            margin: 20px 0 14px 0;
            color: var(--text-primary);
        }

        .error-desc {
            font-size: 0.98rem;
            color: var(--text-secondary);
            line-height: 1.65;
            margin: 0 auto 36px auto;
            max-width: 500px;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--color-brainly-green, #99ee60);
            color: #000000;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.9rem;
            padding: 13px 30px;
            border-radius: 24px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(153, 238, 96, 0.2);
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(153, 238, 96, 0.35);
            opacity: 0.95;
        }

        .btn-home svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
        }

        @media (max-width: 768px) {
            .error-wrapper { padding: 60px 20px; }
            .error-code { font-size: 6rem; }
            .error-title { font-size: 1.5rem; }
        }
    </style>
    <script src="js/theme.js"></script>
    <script src="js/main.js" defer></script>
</head>
<body>

    <div id="google_translate_element"></div>
    <header id="header-placeholder"></header>

    <main class="error-wrapper">
        <canvas id="constellation-canvas"></canvas>
        <div class="glow-404"></div>

        <div class="error-container">
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Sector Not Found</h2>
            <p class="error-desc">
                The resource or URL sequence you are attempting to access does not exist within our system index or has been relocated.
            </p>
            <a href="index.html" class="btn-home">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Return Home</span>
            </a>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initConstellationCanvas();
        });

        function initConstellationCanvas() {
            const canvas = document.getElementById('constellation-canvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            let width = canvas.width = canvas.offsetWidth;
            let height = canvas.height = canvas.offsetHeight;

            const dots = [];
            const dotCount = Math.min(50, Math.floor((width * height) / 14000));
            const connectionDistance = 130;

            class Dot {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.35;
                    this.vy = (Math.random() - 0.5) * 0.35;
                    this.radius = Math.random() * 2.5 + 2; 
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#99ee60';
                    ctx.fill();
                }
            }

            for (let i = 0; i < dotCount; i++) {
                dots.push(new Dot());
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);

                for (let i = 0; i < dots.length; i++) {
                    dots[i].update();
                    dots[i].draw();

                    for (let j = i + 1; j < dots.length; j++) {
                        const dx = dots[i].x - dots[j].x;
                        const dy = dots[i].y - dots[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < connectionDistance) {
                            ctx.beginPath();
                            ctx.moveTo(dots[i].x, dots[i].y);
                            ctx.lineTo(dots[j].x, dots[j].y);
                            const alpha = (1 - (dist / connectionDistance)) * 0.18;
                            ctx.strokeStyle = `rgba(153, 238, 96, ${alpha})`;
                            ctx.lineWidth = 1.1;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', () => {
                width = canvas.width = canvas.offsetWidth;
                height = canvas.height = canvas.offsetHeight;
            });

            animate();
        }
    </script>
</body>
</html>
