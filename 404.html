<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | BrainlyHQ</title>
    <link rel="icon" type="image/png" href="assets/BRAINLYHQ LOGO.png">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .error-hero-canvas {
            position: relative;
            width: 100%;
            height: 420px;
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
        }

        #constellation-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.65;
        }

        .error-hero-inner {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 0 24px;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 900;
            color: var(--color-brainly-green);
            margin: 0;
            line-height: 1;
            letter-spacing: -2px;
            text-shadow: 0 0 30px rgba(153, 238, 96, 0.2);
        }

        .error-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-primary);
            margin: 12px 0;
        }

        .error-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            max-width: 500px;
            margin: 0 auto 24px auto;
            line-height: 1.6;
        }

        .btn-return-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--color-brainly-green);
            color: #000000;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.9rem;
            padding: 12px 26px;
            border-radius: 24px;
            transition: all 0.2s ease;
        }

        .btn-return-home:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(153, 238, 96, 0.3);
        }
    </style>

    <script src="js/theme.js"></script>
    <script src="js/main.js" defer></script>
</head>
<body>

    <div id="google_translate_element"></div>
    <header id="header-placeholder"></header>

    <div class="error-hero-canvas">
        <canvas id="constellation-canvas"></canvas>
        <div class="error-hero-inner">
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Sector Not Found</h2>
            <p class="error-desc">
                The requesting endpoint or module does not exist in the BrainlyHQ ecosystem matrix.
            </p>
            <a href="index.html" class="btn-return-home">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M19 12H5"></path>
                    <path d="M12 19l-7-7 7-7"></path>
                </svg>
                <span>Return to Home</span>
            </a>
        </div>
    </div>

    <footer id="footer-placeholder"></footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initConstellationCanvas();
        });

        function initConstellationCanvas() {
            const canvas = document.getElementById('constellation-canvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            let width = canvas.width = canvas.offsetWidth;
            let height = canvas.height = canvas.offsetHeight;

            const dots = [];
            const dotCount = Math.min(50, Math.floor((width * height) / 14000));
            const connectionDistance = 130;

            class Dot {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.35;
                    this.vy = (Math.random() - 0.5) * 0.35;
                    this.radius = Math.random() * 2.5 + 2; 
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#99ee60';
                    ctx.fill();
                }
            }

            for (let i = 0; i < dotCount; i++) {
                dots.push(new Dot());
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);

                for (let i = 0; i < dots.length; i++) {
                    dots[i].update();
                    dots[i].draw();

                    for (let j = i + 1; j < dots.length; j++) {
                        const dx = dots[i].x - dots[j].x;
                        const dy = dots[i].y - dots[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < connectionDistance) {
                            ctx.beginPath();
                            ctx.moveTo(dots[i].x, dots[i].y);
                            ctx.lineTo(dots[j].x, dots[j].y);
                            const alpha = (1 - (dist / connectionDistance)) * 0.18;
                            ctx.strokeStyle = `rgba(153, 238, 96, ${alpha})`;
                            ctx.lineWidth = 1.1;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', () => {
                width = canvas.width = canvas.offsetWidth;
                height = canvas.height = canvas.offsetHeight;
            });

            animate();
        }
    </script>
</body>
</html>
