<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainlyHQ - System Status</title>
    <link rel="icon" type="image/png" href="assets/BRAINLYHQ LOGO.png">
    <link rel="stylesheet" href="css/style.css">

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#99EE60">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    
    <style>
        body {
            background-color: #0b0c0f;
            color: #f5f7fa;
            font-family: var(--font-primary);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        [data-theme="light"] body {
            background-color: #f4f6f8;
            color: #0f172a;
        }

        /* Kontener powrotny */
        .back-home-container {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 16px;
            max-width: 1200px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 8px 16px;
            background-color: rgba(240, 243, 246, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .btn-back-home:hover {
            color: var(--color-brainly-green);
            border-color: var(--color-brainly-green);
            background-color: rgba(153, 238, 96, 0.02);
            transform: translateX(-2px);
        }

        /* Pełnowymiarowy kontener dla iframe */
        .status-iframe-container {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
        }

        .status-iframe {
            width: 100%;
            height: 100%;
            min-height: 750px;
            border: none;
            display: block;
        }
    </style>

    <!-- OneSignal Push Notifications -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "8bb2f22e-fcd8-49d4-a13e-63daf90aac1e",
          safari_web_id: "web.onesignal.auto.57017041-c410-4b69-86f6-455278402f0c",
        });
      });
    </script>
</head>
<body>

    <div class="back-home-container">
        <a href="index.html" class="btn-back-home">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Back to Hub</span>
        </a>
    </div>

    <!-- Kontener z iFrame osadzającym UptimeRobot -->
    <div class="status-iframe-container">
        <iframe 
            src="https://stats.uptimerobot.com/c3s43Jfv8U" 
            class="status-iframe"
            title="BrainlyHQ Uptime Status"
            allowfullscreen>
        </iframe>
    </div>

    <script>
        function syncTheme() {
            const savedTheme = localStorage.getItem("theme") || "dark";
            document.documentElement.setAttribute("data-theme", savedTheme);
        }

        syncTheme();

        window.addEventListener('storage', (e) => {
            if (e.key === 'theme') {
                syncTheme();
            }
        });
    </script>
</body>
</html>
