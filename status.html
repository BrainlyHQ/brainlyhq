<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting - BrainlyHQ Status</title>
    <link rel="icon" type="image/png" href="assets/BRAINLYHQ LOGO.png">
    <link rel="stylesheet" href="css/style.css">

    <!-- Meta Tags -->
    <meta name="theme-color" content="#99EE60">

    <style>
        body {
            background-color: #0b0c0f;
            color: #f5f7fa;
            font-family: var(--font-primary);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        [data-theme="light"] body {
            background-color: #f4f6f8;
            color: #0f172a;
        }

        .redirect-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        .redirect-icon-wrapper {
            width: 64px;
            height: 64px;
            background: rgba(153, 238, 96, 0.1);
            border: 1px solid var(--color-brainly-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
            color: var(--color-brainly-green);
        }

        .redirect-title {
            font-size: 1.5rem;
            font-weight: 900;
            margin: 0 0 12px 0;
            color: var(--text-primary);
        }

        .redirect-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin: 0 0 28px 0;
        }

        .redirect-desc strong {
            color: var(--color-brainly-green);
        }

        .actions-row {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-proceed {
            background-color: var(--color-brainly-green);
            color: #000000;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s ease, transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(153, 238, 96, 0.2);
        }

        .btn-proceed:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.88rem;
            transition: color 0.2s ease;
        }

        .btn-cancel:hover {
            color: var(--text-primary);
        }
    </style>
</head>
<body>

    <div class="redirect-card">
        <div class="redirect-icon-wrapper">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
        </div>

        <h1 class="redirect-title">External Status Page</h1>
        <p class="redirect-desc">
            You are being redirected to our official status monitor hosted on UptimeRobot in <strong id="countdown-timer">5</strong> seconds.
        </p>

        <div class="actions-row">
            <a href="https://stats.uptimerobot.com/c3s43Jfv8U" class="btn-proceed" id="redirect-link">
                <span>Go to Status Page Now</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>
            <a href="index.html" class="btn-cancel">Return to BrainlyHQ Hub</a>
        </div>
    </div>

    <script>
        const targetUrl = "https://stats.uptimerobot.com/c3s43Jfv8U";
        let seconds = 5;
        const timerElement = document.getElementById("countdown-timer");

        const interval = setInterval(() => {
            seconds--;
            if (timerElement) {
                timerElement.innerText = seconds;
            }

            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = targetUrl;
            }
        }, 1000);

        // Obsługa powrotu strzałką w lewo z pamięci podręcznej (bfcache)
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                window.location.href = "index.html";
            }
        });

        // Motyw
        function syncTheme() {
            const savedTheme = localStorage.getItem("theme") || "dark";
            document.documentElement.setAttribute("data-theme", savedTheme);
        }
        syncTheme();
    </script>
</body>
</html>
