<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - BrainlyHQ</title>
    <link rel="icon" type="image/png" href="assets/BRAINLYHQ LOGO.png">
    <link rel="stylesheet" href="css/style.css">

    <!-- Parser Markdown w przeglądarce -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        .post-container {
            max-width: 800px;
            margin: 50px auto 70px auto;
            padding: 0 24px;
        }

        .post-header {
            margin-bottom: 32px;
            text-align: left;
        }

        .post-tag {
            background-color: rgba(153, 238, 96, 0.15);
            color: var(--color-brainly-green);
            padding: 6px 14px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.8rem;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 16px;
        }

        .post-title {
            font-size: 2.4rem;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1.25;
            margin-bottom: 14px;
        }

        .post-date {
            font-family: monospace;
            color: var(--text-secondary);
            font-size: 0.88rem;
        }

        .post-cover-img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 32px;
            border: 1px solid var(--border-color);
        }

        .post-body {
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text-primary);
        }

        .post-body h1, .post-body h2, .post-body h3 {
            color: var(--color-brainly-green);
            margin-top: 28px;
            margin-bottom: 14px;
        }

        .post-body p { margin-bottom: 20px; }
        .post-body ul, .post-body ol { margin-left: 24px; margin-bottom: 20px; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--color-brainly-green);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
    </style>

    <script src="js/theme.js"></script>
    <script src="js/main.js" defer></script>
</head>
<body>

    <header id="header-placeholder"></header>

    <main class="post-container">
        <a href="blog.html" class="back-link">
            &#8592; Back to all posts
        </a>

        <div id="post-content">
            <p>Loading article...</p>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>

    <script>
        const REPO_OWNER = "Ksperix";
        const REPO_NAME = "brainlyhq";

        async function loadSinglePost() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get("slug");
            const container = document.getElementById("post-content");

            if (!slug) {
                container.innerHTML = `<p>Article not found.</p>`;
                return;
            }

            try {
                const res = await fetch(`https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/content/blog/${slug}.json`);
                if (!res.ok) throw new Error("Post not found");

                const post = await res.json();
                document.title = `${post.title} - BrainlyHQ`;

                container.innerHTML = `
                    <div class="post-header">
                        <span class="post-tag">${post.category || 'General'}</span>
                        <h1 class="post-title">${post.title}</h1>
                        <div class="post-date">${post.date ? new Date(post.date).toLocaleDateString() : ''}</div>
                    </div>
                    ${post.image ? `<img src="${post.image}" class="post-cover-img" alt="${post.title}">` : ''}
                    <div class="post-body">
                        ${marked.parse(post.body || '')}
                    </div>
                `;
            } catch (err) {
                container.innerHTML = `<p>Error loading article content.</p>`;
            }
        }

        document.addEventListener("DOMContentLoaded", loadSinglePost);
    </script>
</body>
</html>
