<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - BrainlyHQ</title>
    <link rel="icon" type="image/png" href="assets/BRAINLYHQ LOGO.png">
    <link rel="stylesheet" href="css/style.css">

    <!-- Parser Markdown w przeglądarce -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        .post-container {
            max-width: 800px;
            margin: 50px auto 70px auto;
            padding: 0 24px;
        }

        .post-header {
            margin-bottom: 32px;
            text-align: left;
        }

        .post-tag {
            background-color: rgba(153, 238, 96, 0.15);
            color: var(--color-brainly-green);
            padding: 6px 14px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.8rem;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 16px;
        }

        .post-title {
            font-size: 2.4rem;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1.2;
            margin-bottom: 14px;
        }

        .post-meta-details {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
            font-size: 0.88rem;
        }

        .post-author {
            color: var(--text-primary);
            font-weight: 700;
        }

        .post-cover-img {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 32px;
            border: 1px solid var(--border-color);
        }

        /* STYLIZACJA TREŚCI SVELTIA / MARKDOWN */
        .post-body {
            font-size: 1rem;
            line-height: 1.5; /* Normalna, naturalna interlinia */
            color: var(--text-primary);
        }

        /* Akapity - przerwa tylko po klawiszu Enter */
        .post-body p {
            margin-top: 0;
            margin-bottom: 0.8em;
        }

        .post-body p:last-child {
            margin-bottom: 0;
        }

        /* NAGŁÓWKI H1 - H6 W ZIELONYM KOLORZE BRAINLY */
        .post-body h1, 
        .post-body h2, 
        .post-body h3, 
        .post-body h4, 
        .post-body h5, 
        .post-body h6 {
            color: var(--color-brainly-green);
            font-weight: 800;
            line-height: 1.3;
            margin-top: 1.6em;
            margin-bottom: 0.6em;
        }

        .post-body h1 {
            font-size: 1.8rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .post-body h2 {
            font-size: 1.5rem;
        }

        .post-body h3 {
            font-size: 1.3rem;
        }

        .post-body h4 {
            font-size: 1.15rem;
        }

        .post-body h5 {
            font-size: 1.05rem;
        }

        .post-body h6 {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* LINKI ORAZ POGRUBIENIA */
        .post-body strong {
            color: var(--text-primary);
            font-weight: 700;
        }

        .post-body a {
            color: var(--color-brainly-green);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .post-body a:hover {
            opacity: 0.85;
        }

        /* LISTY */
        .post-body ul, .post-body ol {
            margin-top: 0;
            margin-bottom: 0.8em;
            padding-left: 24px;
        }

        .post-body li {
            margin-bottom: 4px;
        }

        /* CYTATY */
        .post-body blockquote {
            margin: 1.2em 0;
            padding: 12px 18px;
            background-color: var(--bg-secondary);
            border-left: 4px solid var(--color-brainly-green);
            border-radius: 0 10px 10px 0;
            font-style: italic;
            color: var(--text-secondary);
        }

        .post-body blockquote p {
            margin-bottom: 0;
        }

        /* BLOK KODU I JEGO SKŁADNIK JEDNOLINIOWY */
        .post-body pre {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            overflow-x: auto;
            margin: 1.2em 0;
            line-height: 1.45;
        }

        .post-body code {
            font-family: Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace;
            font-size: 0.88rem;
            background-color: var(--bg-secondary);
            padding: 2px 6px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            color: var(--color-brainly-green);
        }

        .post-body pre code {
            background-color: transparent;
            padding: 0;
            border: none;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        /* OBRAZKI W TREŚCI */
        .post-body img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 1.2em 0;
            border: 1px solid var(--border-color);
            display: block;
        }

        .post-body hr {
            border: 0;
            height: 1px;
            background: var(--border-color);
            margin: 1.8em 0;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--color-brainly-green);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
    </style>

    <script src="js/theme.js"></script>
    <script src="js/main.js" defer></script>
</head>
<body>

    <header id="header-placeholder"></header>

    <main class="post-container">
        <a href="blog.html" class="back-link">
            &#8592; Back to all posts
        </a>

        <div id="post-content">
            <p>Loading article...</p>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>

    <script>
        const REPO_OWNER = "Ksperix";
        const REPO_NAME = "brainlyhq";

        function calculateReadTime(text) {
            if (!text) return '1 min read';
            const wordsPerMinute = 100;
            const words = text.trim().split(/\s+/).length;
            const minutes = Math.ceil(words / wordsPerMinute);
            return `${minutes} min read`;
        }

        async function loadSinglePost() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get("slug");
            const container = document.getElementById("post-content");

            if (!slug) {
                container.innerHTML = `<p>Article not found.</p>`;
                return;
            }

            try {
                const res = await fetch(`https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/content/blog/${slug}.json?t=${Date.now()}`);
                if (!res.ok) throw new Error("Post not found");

                const post = await res.json();
                document.title = `${post.title} - BrainlyHQ`;

                container.innerHTML = `
                    <div class="post-header">
                        <span class="post-tag">${post.category || 'General'}</span>
                        <h1 class="post-title">${post.title}</h1>
                        <div class="post-meta-details">
                            <span class="post-author">By ${post.author || 'BrainlyHQ Team'}</span>
                            <span>•</span>
                            <span>${post.date ? new Date(post.date).toLocaleDateString() : ''}</span>
                            <span>•</span>
                            <span>${calculateReadTime(post.body)}</span>
                        </div>
                    </div>
                    ${post.image ? `<img src="${post.image}" class="post-cover-img" alt="${post.title}">` : ''}
                    <div class="post-body">
                        ${marked.parse(post.body || '')}
                    </div>
                `;
            } catch (err) {
                container.innerHTML = `<p>Error loading article content.</p>`;
            }
        }

        document.addEventListener("DOMContentLoaded", loadSinglePost);
    </script>
</body>
</html>
