name: Notify Discord on New Blog Post

on:
  push:
    branches:
      - main
    paths:
      - 'content/blog/*.json'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Changed Blog Files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            content/blog/*.json

      - name: Send Rich Discord Embed
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_BLOG_WEBHOOK }}
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          LOGO_URL="https://raw.githubusercontent.com/Ksperix/brainlyhq/main/assets/BRAINLYHQ%20LOGO.png"

          if [ -z "$WEBHOOK_URL" ]; then
            echo "CRITICAL ERROR: Secret DISCORD_BLOG_WEBHOOK jest pusty!"
            exit 1
          fi

          if [ -z "$ALL_CHANGED_FILES" ]; then
            echo "Brak nowych lub zmodyfikowanych plików JSON."
            exit 0
          fi

          for FILE in $ALL_CHANGED_FILES; do
            echo "=== Przetwarzanie pliku: $FILE ==="

            TITLE=$(jq -r '.title // "Nowy wpis na blogu"' "$FILE")
            EXCERPT=$(jq -r '.excerpt // ""' "$FILE")
            CATEGORY=$(jq -r '.category // "Ogólne"' "$FILE")
            IMAGE=$(jq -r '.image // ""' "$FILE")
            SLUG=$(basename "$FILE" .json)
            POST_URL="https://discord.brainly.com/post.html?slug=$SLUG"

            PAYLOAD=$(jq -n \
              --arg title "$TITLE" \
              --arg desc "$EXCERPT" \
              --arg url "$POST_URL" \
              --arg category "$CATEGORY" \
              --arg image "$IMAGE" \
              --arg logo "$LOGO_URL" \
              '{
                username: "BrainlyHQ Blog",
                avatar_url: $logo,
                embeds: [{
                  title: $title,
                  description: $desc,
                  url: $url,
                  color: 10088032,
                  fields: [
                    {
                      name: "Kategoria",
                      value: $category,
                      inline: true
                    }
                  ],
                  image: (if $image != "" and $image != null then {url: $image} else null end),
                  footer: {
                    text: "BrainlyHQ News • discord.brainly.com",
                    icon_url: $logo
                  }
                }]
              }')

            echo "Wysyłanie danych do Discorda..."
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK_URL")
            echo "Discord API Response Code: $RESPONSE"

            if [ "$RESPONSE" -ne 200 ] && [ "$RESPONSE" -ne 204 ]; then
              echo "BŁĄD WYSYŁANIA! Kod odpowiedzi Discorda: $RESPONSE"
              echo "Payload: $PAYLOAD"
              exit 1
            else
              echo "Sukces! Wiadomość wysłana (HTTP $RESPONSE)."
            fi
          done
