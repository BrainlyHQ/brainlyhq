name: Notify Discord on New Blog Post

on:
  push:
    branches:
      - main
    paths:
      - 'content/blog/*.json'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Changed Blog Files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            content/blog/*.json

      - name: Send Rich Discord Embed
        if: steps.changed-files.outputs.any_changed == 'true'
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_BLOG_WEBHOOK }}
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          LOGO_URL="https://raw.githubusercontent.com/Ksperix/brainlyhq/main/assets/BRAINLYHQ%20LOGO.png"

          for FILE in $ALL_CHANGED_FILES; do
            echo "Przetwarzanie wpisu: $FILE"

            TITLE=$(jq -r '.title // "Nowy wpis na blogu"' "$FILE")
            EXCERPT=$(jq -r '.excerpt // ""' "$FILE")
            CATEGORY=$(jq -r '.category // "Ogólne"' "$FILE")
            IMAGE=$(jq -r '.image // ""' "$FILE")
            SLUG=$(basename "$FILE" .json)
            POST_URL="https://discord.brainly.com/post.html?slug=$SLUG"

            PAYLOAD=$(jq -n \
              --arg title "$TITLE" \
              --arg desc "$EXCERPT" \
              --arg url "$POST_URL" \
              --arg category "$CATEGORY" \
              --arg image "$IMAGE" \
              --arg logo "$LOGO_URL" \
              '{
                username: "BrainlyHQ Blog",
                avatar_url: $logo,
                embeds: [{
                  title: $title,
                  description: $desc,
                  url: $url,
                  color: 10088032,
                  fields: [
                    {
                      name: "Kategoria",
                      value: $category,
                      inline: true
                    }
                  ],
                  image: (if $image != "" then {url: $image} else null end),
                  footer: {
                    text: "BrainlyHQ News • discord.brainly.com",
                    icon_url: $logo
                  }
                }]
              }')

            curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK_URL"
          done
