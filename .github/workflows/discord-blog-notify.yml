name: Notify Discord on New Blog Post

on:
  push:
    branches:
      - main
    paths:
      - 'content/blog/*.json'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Changed Blog Files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            content/blog/*.json

      - name: Send Rich Discord Embed
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_BLOG_WEBHOOK }}
          ADDED_FILES: ${{ steps.changed-files.outputs.added_files }}
          MODIFIED_FILES: ${{ steps.changed-files.outputs.modified_files }}
        run: |
          LOGO_URL="https://raw.githubusercontent.com/Ksperix/brainlyhq/main/assets/brainlycorewhite.png"

          if [ -z "$WEBHOOK_URL" ]; then
            echo "CRITICAL ERROR: Secret DISCORD_BLOG_WEBHOOK jest pusty!"
            exit 1
          fi

          FILES_TO_NOTIFY=""

          # 1. Zawsze dodawaj nowo utworzone pliki
          for FILE in $ADDED_FILES; do
            FILES_TO_NOTIFY="$FILES_TO_NOTIFY $FILE"
          done

          # 2. Dla edytowanych plików sprawdź bezpiecznie zmianę tytułu lub daty
          for FILE in $MODIFIED_FILES; do
            echo "Sprawdzanie zmian w edytowanym pliku: $FILE"
            
            # Bezpieczne pobranie poprzedniej zawartości z HEAD^1
            OLD_JSON=$(git show HEAD^1:"$FILE" 2>/dev/null || echo "{}")
            
            OLD_TITLE=$(echo "$OLD_JSON" | jq -r '.title // ""')
            NEW_TITLE=$(jq -r '.title // ""' "$FILE")

            OLD_DATE=$(echo "$OLD_JSON" | jq -r '.date // ""')
            NEW_DATE=$(jq -r '.date // ""' "$FILE")

            if [ "$OLD_TITLE" != "$NEW_TITLE" ] || [ "$OLD_DATE" != "$NEW_DATE" ]; then
              echo "Wykryto zmianę tytułu lub daty w $FILE! Wysyłam powiadomienie."
              FILES_TO_NOTIFY="$FILES_TO_NOTIFY $FILE"
            else
              echo "Edycja $FILE nie dotyczyła tytułu ani daty - pomijam Discorda."
            fi
          done

          if [ -z "$FILES_TO_NOTIFY" ]; then
            echo "Brak nowych postów oraz brak zmian w tytułach/datach. Pomijam Discorda."
            exit 0
          fi

          # Wysyłanie powiadomień
          for FILE in $FILES_TO_NOTIFY; do
            echo "=== Przetwarzanie artykułu: $FILE ==="

            TITLE=$(jq -r '.title // "New Blog Post"' "$FILE")
            EXCERPT=$(jq -r '.excerpt // ""' "$FILE")
            IMAGE_RAW=$(jq -r '.image // ""' "$FILE")
            SLUG=$(basename "$FILE" .json)
            POST_URL="https://discord.brainly.com/post.html?slug=$SLUG"

            # Konwersja ścieżki obrazka na pełny adres URL i kodowanie znaków specjalnych
            IMAGE_URL=""
            if [ -n "$IMAGE_RAW" ] && [ "$IMAGE_RAW" != "null" ]; then
              if [[ "$IMAGE_RAW" =~ ^https?:// ]]; then
                FULL_PATH="$IMAGE_RAW"
              else
                CLEAN_PATH=$(echo "$IMAGE_RAW" | sed 's/^\///')
                FULL_PATH="https://discord.brainly.com/$CLEAN_PATH"
              fi
              IMAGE_URL=$(jq -nr --arg url "$FULL_PATH" '$url | @uri' | sed 's/%3A/:/g; s/%2F/\//g')
            fi

            PAYLOAD=$(jq -n \
              --arg title "$TITLE" \
              --arg desc "$EXCERPT" \
              --arg url "$POST_URL" \
              --arg image "$IMAGE_URL" \
              --arg logo "$LOGO_URL" \
              '{
                content: "<@&1536718339207077959>",
                username: "BrainlyHQ Blog",
                avatar_url: $logo,
                embeds: [{
                  title: $title,
                  description: $desc,
                  url: $url,
                  color: 10088032,
                  image: (if $image != "" and $image != null then {url: $image} else null end)
                }]
              }')

            echo "Wysyłanie danych do Discorda..."
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK_URL")
            echo "Discord API Response Code: $RESPONSE"

            if [ "$RESPONSE" -ne 200 ] && [ "$RESPONSE" -ne 204 ]; then
              echo "BŁĄD WYSYŁANIA! Kod odpowiedzi Discorda: $RESPONSE"
              echo "Payload: $PAYLOAD"
              exit 1
            else
              echo "Sukces! Wiadomość wysłana (HTTP $RESPONSE)."
            fi
          done
