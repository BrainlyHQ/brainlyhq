name: Notify Discord on New Blog Post

on:
  push:
    branches:
      - main
    paths:
      - 'content/blog/*.json' # Uruchamia się TYLKO gdy zmieni/doda się plik posta

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Pobiera 2 ostatnie commity do porównania różnic

      - name: Send Rich Discord Embed
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_BLOG_WEBHOOK }}
        run: |
          # Znajdź nowo dodane lub zmodyfikowane pliki JSON w katalogu bloga
          ADDED_FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD | grep '^content/blog/.*\.json$' || true)

          if [ -z "$ADDED_FILES" ]; then
            echo "Brak nowych lub zmodyfikowanych postów."
            exit 0
          fi

          for FILE in $ADDED_FILES; do
            echo "Przetwarzanie pliku: $FILE"

            # Odczyt danych z pliku JSON za pomocą jq
            TITLE=$(jq -r '.title // "Nowy wpis na blogu"' "$FILE")
            EXCERPT=$(jq -r '.excerpt // ""' "$FILE")
            CATEGORY=$(jq -r '.category // "Ogólne"' "$FILE")
            IMAGE=$(jq -r '.image // ""' "$FILE")
            SLUG=$(basename "$FILE" .json)
            POST_URL="https://discord.brainly.com/post.html?slug=$SLUG"

            # Przygotowanie payloadu JSON dla Discord Embed
            PAYLOAD=$(jq -n \
              --arg title "$TITLE" \
              --arg desc "$EXCERPT" \
              --arg url "$POST_URL" \
              --arg category "$CATEGORY" \
              --arg image "$IMAGE" \
              '{
                username: "BrainlyHQ Blog",
                avatar_url: "https://discord.brainly.com/assets/BRAINLYHQ%20LOGO.png",
                embeds: [{
                  title: $title,
                  description: $desc,
                  url: $url,
                  color: 10088032,
                  fields: [
                    {
                      name: "Kategoria",
                      value: $category,
                      inline: true
                    }
                  ],
                  image: (if $image != "" then {url: $image} else null end),
                  footer: {
                    text: "BrainlyHQ News • discord.brainly.com",
                    icon_url: "https://discord.brainly.com/assets/BRAINLYHQ%20LOGO.png"
                  }
                }]
              }')

            # Wysyłanie powiadomienia na Discorda
            curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK_URL"
          done
